# AttestMesh gas-sponsorship-webhook — Cloudflare Worker config.
#
# Secrets (NOT committed; set via `wrangler secret put <NAME>`):
#   RPC_URL                — Alchemy/other EVM RPC used for the eth_call lookups.
#   ALCHEMY_WEBHOOK_TOKEN  — shared secret Alchemy includes as `?token=` on POST /.
#
# See docs/specs/gas-webhook.md §4 for the full configuration table.

name = "attestmesh-gas-sponsorship-webhook"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Plaintext configuration (spec §4). These are safe to commit; secrets are not.
# Live deployment: Base mainnet (8453); AttestMesh infra from script/deployments/8453.json.
[vars]
EXPECTED_CHAIN_ID = "8453"
# ClusterDiamondFactory address deployed by DeployInfra.s.sol on Base mainnet (fixed-facet redeploy).
CANONICAL_CLUSTER_FACTORY = "0xf6E85fD138E3208d3AAE63ce4E2A33f20e82b9fb"
# ClusterMemberFactory address deployed by DeployInfra.s.sol on Base mainnet (fixed-facet redeploy).
CANONICAL_MEMBER_FACTORY = "0xFf9f438EFdAa197f4ae59D1d711C4f09640b8417"
CACHE_TTL_SECONDS = "86400"
LOG_LEVEL = "info"

# KV namespace bindings (spec §4, §8). Replace the placeholder ids with the real
# namespace ids from `wrangler kv:namespace create <NAME>` before deploying.
[[kv_namespaces]]
binding = "FACTORY_PROVENANCE_CACHE"
id = "9d310e659b8a4c14a3959e08be470657"

[[kv_namespaces]]
binding = "MEMBER_PROVENANCE_CACHE"
id = "8e6ce681beca4a0ea4e60625bcae63cc"
