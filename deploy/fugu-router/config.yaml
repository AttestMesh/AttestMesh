# fugu-router LiteLLM proxy config — docs/research/fugu-subscription-pooling.md §3.4.
# Public clients should call the fugu_session_router front door with model=fugu or
# model=fugu-ultra for Sakana subscription-pooled calls. Direct provider models are
# exposed on the same front door but pass through to LiteLLM unchanged. LiteLLM only
# exposes account-specific upstream model names for Fugu so the router can make sticky
# session assignments and retry a different subscription on quota/rate-limit errors.
# PAYG is intentionally absent from the serving path.
# The entrypoint prunes any deployment whose api_key env var is unset at runtime
# (SAKANA_SUB_3_KEY is optional).
# Custom Fugu pricing is mandatory: LiteLLM's built-in price table has no Sakana entries,
# so without model_info costs the computed spend is silently zero (paper §3.4).

model_list:
  # ---- fugu-ultra: coordinator/verifier tier (dated pin — rolling alias drifts, §3.3) ----
  - model_name: fugu-ultra-sub-1
    litellm_params:
      model: openai/fugu-ultra-20260615
      api_base: os.environ/SAKANA_API_BASE
      api_key: os.environ/SAKANA_SUB_1_KEY
    model_info:
      id: fugu-ultra-sub-1
      fugu_account_id: sub1
      fugu_requested_model: fugu-ultra
      input_cost_per_token: 5e-6 # $5/M (§2.1 rate card; <=272K context)
      output_cost_per_token: 3e-5 # $30/M
      cache_read_input_token_cost: 5e-7 # $0.50/M cached input
  - model_name: fugu-ultra-sub-2
    litellm_params:
      model: openai/fugu-ultra-20260615
      api_base: os.environ/SAKANA_API_BASE
      api_key: os.environ/SAKANA_SUB_2_KEY
    model_info:
      id: fugu-ultra-sub-2
      fugu_account_id: sub2
      fugu_requested_model: fugu-ultra
      input_cost_per_token: 5e-6
      output_cost_per_token: 3e-5
      cache_read_input_token_cost: 5e-7
  - model_name: fugu-ultra-sub-3
    litellm_params:
      model: openai/fugu-ultra-20260615
      api_base: os.environ/SAKANA_API_BASE
      api_key: os.environ/SAKANA_SUB_3_KEY # optional; pruned at boot if unset
    model_info:
      id: fugu-ultra-sub-3
      fugu_account_id: sub3
      fugu_requested_model: fugu-ultra
      input_cost_per_token: 5e-6
      output_cost_per_token: 3e-5
      cache_read_input_token_cost: 5e-7

  # ---- fugu: worker tier (standard, underlying-model passthrough billing, §3.3) ----
  # No model_info costs: passthrough pricing depends on the underlying model Sakana routes
  # to and is unknown per-request — spend for the standard tier is NOT tracked yet.
  # Reconcile against the Sakana console (§4.3) until a defensible per-token rate exists.
  - model_name: fugu-sub-1
    litellm_params:
      model: openai/fugu
      api_base: os.environ/SAKANA_API_BASE
      api_key: os.environ/SAKANA_SUB_1_KEY
    model_info:
      id: fugu-sub-1
      fugu_account_id: sub1
      fugu_requested_model: fugu
  - model_name: fugu-sub-2
    litellm_params:
      model: openai/fugu
      api_base: os.environ/SAKANA_API_BASE
      api_key: os.environ/SAKANA_SUB_2_KEY
    model_info:
      id: fugu-sub-2
      fugu_account_id: sub2
      fugu_requested_model: fugu
  - model_name: fugu-sub-3
    litellm_params:
      model: openai/fugu
      api_base: os.environ/SAKANA_API_BASE
      api_key: os.environ/SAKANA_SUB_3_KEY # optional; pruned at boot if unset
    model_info:
      id: fugu-sub-3
      fugu_account_id: sub3
      fugu_requested_model: fugu

  # ---- RedPill direct models: no Fugu subscription placement, served by LiteLLM pass-through ----
  - model_name: glm-5.2
    litellm_params:
      model: openai/z-ai/glm-5.2
      api_base: os.environ/REDPILL_API_BASE
      api_key: os.environ/REDPILL_API_KEY
    model_info:
      id: glm-5.2
      input_cost_per_token: 1.4e-6 # RedPill $1.40/M input tokens
      output_cost_per_token: 4.4e-6 # RedPill $4.40/M output tokens
      cache_read_input_token_cost: 7e-7 # RedPill $0.70/M cache read tokens
  - model_name: qwen/qwen3-embedding-8b
    litellm_params:
      model: openai/qwen/qwen3-embedding-8b
      api_base: os.environ/REDPILL_API_BASE
      api_key: os.environ/REDPILL_API_KEY
      # LiteLLM otherwise sends encoding_format=null; RedPill accepts explicit float.
      encoding_format: float
    model_info:
      id: qwen/qwen3-embedding-8b
      mode: embedding
      input_cost_per_token: 1e-8 # RedPill $0.01/M input tokens
      output_cost_per_token: 0 # RedPill $0.00/M output tokens
  - model_name: openai/gpt-oss-120b
    litellm_params:
      # The first `openai/` selects LiteLLM's OpenAI-compatible adapter; the
      # second is part of RedPill's upstream model id.
      model: openai/openai/gpt-oss-120b
      api_base: os.environ/REDPILL_API_BASE
      api_key: os.environ/REDPILL_API_KEY
    model_info:
      id: openai/gpt-oss-120b
      input_cost_per_token: 1.5e-7 # RedPill $0.15/M input tokens
      output_cost_per_token: 6e-7 # RedPill $0.60/M output/reasoning tokens

  # ---- xAI direct models: no Fugu subscription placement, served by LiteLLM pass-through ----
  - model_name: grok-4.5
    litellm_params:
      model: xai/grok-4.5
      api_key: os.environ/XAI_API_KEY
    model_info:
      id: grok-4.5
      input_cost_per_token: 2e-6 # xAI $2.00/M input tokens
      output_cost_per_token: 6e-6 # xAI $6.00/M output tokens
      cache_read_input_token_cost: 5e-7 # xAI $0.50/M cached input tokens
  - model_name: grok-4.3
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY
    model_info:
      id: grok-4.3
      input_cost_per_token: 1.25e-6 # xAI $1.25/M input tokens
      output_cost_per_token: 2.5e-6 # xAI $2.50/M output tokens
      cache_read_input_token_cost: 2e-7 # xAI $0.20/M cached input tokens
  - model_name: grok-imagine-image-quality
    litellm_params:
      model: xai/grok-imagine-image-quality
      api_key: os.environ/XAI_API_KEY
    model_info:
      id: grok-imagine-image-quality
      mode: image_generation
      input_cost_per_image: 0.01 # xAI image input $0.01/image
      output_cost_per_image: 0.05 # xAI quality image output $0.05/image at 1K; 2K is $0.07
  - model_name: grok-imagine-image
    litellm_params:
      model: xai/grok-imagine-image
      api_key: os.environ/XAI_API_KEY
    model_info:
      id: grok-imagine-image
      mode: image_generation
      input_cost_per_image: 0.002 # xAI image input $0.002/image
      output_cost_per_image: 0.02 # xAI standard image output $0.02/image

router_settings:
  # The fugu_session_router chooses subscription placement. LiteLLM stays single-model
  # once the upstream account-specific model is selected.
  routing_strategy: usage-based-routing-v2
  # redis-ha via the sidecar-netns socat forwarder (compose sets REDIS_HOST=sidecar,
  # REDIS_PORT=16379); REDIS_PASSWORD is CSK-derived by the entrypoint, never in env files.
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  cooldown_time: 60 # rate-limit-shaped errors; quota-exhaustion handling refined post-calibration (§5)

litellm_settings:
  # langfuse belongs in success/failure_callback (the documented integration hook); the
  # custom orchestration-token logger goes in callbacks as an import path (PYTHONPATH=/app).
  # Mixing "langfuse" into `callbacks` silently fails to register the tracer.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  callbacks: ["fugu_credit.fugu_credit_handler"]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  salt_key: os.environ/LITELLM_SALT_KEY
