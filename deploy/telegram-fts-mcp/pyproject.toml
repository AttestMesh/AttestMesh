[project]
name = "telegram-fts-mcp"
version = "0.1.0"
description = "Mesh-only MCP server: Postgres full-text search over the telegram-sync archive."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "asyncpg>=0.29",
]

[project.scripts]
telegram-fts-mcp = "telegram_fts_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_fts_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
