services:
  sidecar:
    image: ghcr.io/dmvt/cluster-mesh-agent@sha256:1f7ac9c51ec86a9076a1cabac8a8aef2d7cd2cea43c8fe8052b20af1730e31c3
    restart: unless-stopped
    environment:
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - "9090:9090"
      - "51900:51900"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  registration-helper:
    image: ghcr.io/dmvt/cluster-mesh-agent@sha256:1f7ac9c51ec86a9076a1cabac8a8aef2d7cd2cea43c8fe8052b20af1730e31c3
    restart: unless-stopped
    environment:
      - CLUSTER=${CLUSTER}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - REGISTRATION_HELPER_ADDR=0.0.0.0:9092
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - "9092:9092"
    entrypoint: ["/usr/local/bin/attestmesh-registration-calldata"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /tmp/attestmesh-workload.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    labels:
      attestmesh.name: "postgres"
      attestmesh.source: "fleet-control"

  postgres-mesh-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      sidecar:
        condition: service_started
      postgres:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        while :; do
          ip="$$(ip -4 -o addr show dev attestmesh0 2>/dev/null | awk '{print $$4}' | cut -d/ -f1)"
          [ -n "$$ip" ] && break
          sleep 1
        done
        exec socat -d -d TCP-LISTEN:5432,fork,reuseaddr,bind="$${ip}" TCP:postgres:5432
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
