services:
  sidecar:
    image: ghcr.io/attestmesh/cluster-mesh-agent@sha256:db0a74f5cb68aab6441ac187522276999fc45ee760db3ae3dea0240e86d5c1af
    restart: unless-stopped
    environment:
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - "51900:51900"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        exec docker-entrypoint.sh postgres >/dev/console 2>&1
    env_file:
      - /tmp/attestmesh-workload.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    labels:
      attestmesh.name: "postgres"
      attestmesh.source: "fleet-control"

  postgres-mesh-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      sidecar:
        condition: service_started
      postgres:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        exec socat -d -d TCP-LISTEN:5432,fork,reuseaddr,bind=0.0.0.0 TCP:postgres:5432
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
