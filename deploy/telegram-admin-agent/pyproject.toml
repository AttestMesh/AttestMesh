[project]
name = "telegram-admin-agent"
version = "0.1.0"
description = "Matrix-connected admin agent for the telegram-sync node: Telethon session auth/reauth + sync control."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "matrix-nio>=0.24",
    "openai>=1.30",
    "telethon>=1.36",
    "cryptg",
]

[project.scripts]
telegram-admin-agent = "telegram_admin_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_admin_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
