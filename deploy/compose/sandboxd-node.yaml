# confidential-sandboxes daemon, enrolled as a Path-A member of net_open_webhost.
services:
  sidecar:
    image: ghcr.io/attestmesh/cluster-mesh-agent@sha256:b9e0ae107d9db015c22059c9fecdc28f2b35e09b257eabb4739bd4e46d96f641
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
      - /run:rw,nosuid,nodev,noexec,size=16m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    environment:
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - SIDECAR_STATE_DIR=/var/lib/attestmesh
      - PEER_ENVELOPE_FALLBACK=true
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      - sidecar-state:/var/lib/attestmesh
    ports:
      - "9090:9090"
      - "51900:51900"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun

  # The measured sandboxd release contains the narrowly scoped runsc compatibility adapter. Copy it
  # through a networkless one-shot into a read-only worker volume, leaving the upstream BuildKit
  # image itself exactly at its official digest.
  sandbox-builder-tools:
    image: ghcr.io/dmvt/confidential-sandboxes@sha256:097ca556c69a75e454810fee718e5c5412b6c266aeb5cf36b5c044ff03faa12b
    restart: "no"
    network_mode: none
    read_only: true
    user: "0:0"
    cpus: "0.05"
    mem_limit: 32m
    pids_limit: 16
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/cp"]
    command: ["/usr/local/libexec/runsc-buildkit-shim", "/tools/runsc-buildkit-shim"]
    volumes:
      - sandboxd-builder-tools:/tools

  # Fleet submits bounded source archives to sandboxd over the authenticated control API. BuildKit
  # is a separate measured worker: sandboxd receives only this private Unix socket, and arbitrary
  # Dockerfile RUN steps execute through the same checksum-pinned runsc binary as tenant workloads.
  sandbox-builder:
    image: moby/buildkit@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a
    restart: unless-stopped
    privileged: true
    init: true
    stop_grace_period: 60s
    cpus: "0.50"
    mem_limit: 1024m
    pids_limit: 2048
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
      - /run:rw,nosuid,nodev,noexec,size=32m
      - /var/lib/cni:rw,nosuid,nodev,noexec,size=16m
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - --addr=unix:///run/buildkit/buildkitd.sock
      - --containerd-worker=false
      - --oci-worker=true
      - --oci-worker-binary=/opt/synclave/runsc-buildkit-shim
      - --oci-worker-snapshotter=native
      - --oci-worker-net=bridge
      - --oci-max-parallelism=2
      - --oci-worker-gc=true
      - --oci-worker-gc-keepstorage=4096
    healthcheck:
      test:
        - CMD
        - buildctl
        - --addr=unix:///run/buildkit/buildkitd.sock
        - debug
        - workers
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - sandboxd-buildkit-socket:/run/buildkit
      - type: bind
        source: /var/lib/sandboxd-buildkit
        target: /var/lib/buildkit
        bind:
          create_host_path: false
      - /dstack/persistent/bin/runsc:/usr/local/bin/runsc:ro
      - sandboxd-builder-tools:/opt/synclave:ro
    networks:
      - build-egress
    depends_on:
      sandbox-builder-tools:
        condition: service_completed_successfully

  sandboxd:
    image: ghcr.io/dmvt/confidential-sandboxes@sha256:097ca556c69a75e454810fee718e5c5412b6c266aeb5cf36b5c044ff03faa12b
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    cpus: "1.0"
    mem_limit: 2304m
    pids_limit: 1024
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    ulimits:
      # Sandboxd opens sealed values in CVM memory immediately before launch. Never allow a process
      # crash to serialize that memory into a durable core file.
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 65536
        hard: 65536
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
      - /run:rw,nosuid,nodev,noexec,size=32m
      # One active extraction plus four queued 64 MiB archives remains ephemeral and hard-capped.
      - /var/lib/sandboxd-builds:rw,nosuid,nodev,noexec,size=768m
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 3 http://10.191.255.250:8088/healthz |
          grep -Eq '"ok":[[:space:]]*true.*"dstack_socket_present":[[:space:]]*true' &&
          docker info --format '{{.ServerVersion}}' >/dev/null &&
          xfs_quota -x -c 'state -p' "$${SANDBOX_DISK_ROOT}" |
          grep -q 'Enforcement: ON'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    environment:
      SANDBOX_DAEMON_TOKEN: ${SANDBOX_DAEMON_TOKEN:?set in the CVM env; gateway-exposed control API}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ONCHAIN_CLUSTER_DIAMOND: ${ONCHAIN_CLUSTER_DIAMOND}
      DSTACK_SOCKET: /var/run/dstack.sock
      SANDBOXD_REQUIRE_DSTACK: "1"
      SANDBOXD_MAX_CONCURRENT_IMAGE_PULLS: "1"
      SANDBOXD_IMAGE_CACHE_GC: "1"
      SANDBOXD_MAX_IMAGE_BYTES: "4294967296"
      # Six GiB of the combined 28 GiB Docker/build cache ceiling is reserved for BuildKit.
      SANDBOXD_IMAGE_CACHE_BUDGET_BYTES: "10737418240"
      SANDBOXD_DOCKER_DATA_LIMIT_BYTES: "23622320128"
      SANDBOXD_DOCKER_DATA_RESERVE_BYTES: "6442450944"
      SANDBOXD_MAX_CONCURRENT_EXECS: "16"
      # Fleet authenticates and authorizes the caller; sandboxd additionally bounds duration,
      # argv/output sizes, and host-wide concurrency before dispatch through runsc.
      SANDBOXD_ENABLE_EXEC: "1"
      SANDBOXD_MAX_CONCURRENT_QUOTES: "2"
      SANDBOXD_QUOTES_PER_ID_PER_MINUTE: "10"
      SANDBOXD_QUOTES_GLOBAL_PER_MINUTE: "60"
      SANDBOXD_MAX_PROXY_CONNECTIONS: "32"
      SANDBOXD_MAX_PROXY_CONNECTIONS_PER_SANDBOX: "4"
      SANDBOXD_PROXY_TOTAL_TIMEOUT_SECONDS: "300"
      SANDBOXD_PROXY_READ_TIMEOUT_SECONDS: "60"
      SANDBOXD_PROXY_STREAM_TIMEOUT_SECONDS: "3600"
      # Initial production guardrail for the permanent handle ledger and append-only RTMR3 history.
      # Raising this is an explicit measured deployment change after quote-size monitoring.
      SANDBOXD_MAX_LIFETIME_ALLOCATIONS: "1000"
      SANDBOXD_ALLOWED_IMAGE_REPOSITORIES: "ghcr.io/attestmesh/synclave-workloads"
      DOCKER_CONFIG: /run/sandboxd-docker
      # Fleet-only async source-build boundary. Repository and builder identity are server-owned;
      # callers provide only team/idempotency metadata and verified application/gzip bytes.
      SANDBOXD_BUILDKIT_ADDRESS: unix:///run/buildkit/buildkitd.sock
      SANDBOXD_BUILD_REPOSITORY: ghcr.io/attestmesh/synclave-workloads
      SANDBOXD_BUILDER_ID: moby/buildkit@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a
      SANDBOXD_BUILD_WORK_ROOT: /var/lib/sandboxd-builds
      SANDBOXD_BUILD_STATE_DB: /var/lib/sandboxd/builds.sqlite3
      SANDBOXD_BUILD_CONCURRENCY: "1"
      SANDBOXD_MAX_PENDING_BUILDS: "4"
      SANDBOXD_MAX_BUILD_ARCHIVE_BYTES: "67108864"
      SANDBOXD_MAX_BUILD_SOURCE_BYTES: "268435456"
      SANDBOXD_MAX_BUILD_MEMBERS: "20000"
      SANDBOXD_MAX_BUILD_FILE_BYTES: "67108864"
      SANDBOXD_BUILD_TIMEOUT_SECONDS: "1800"
      SANDBOXD_REQUIRE_BUILDER: "1"
      SANDBOXD_HOST: 10.191.255.250
      SANDBOXD_PORT: "8088"
      # Durable state on a pre-provisioned, separately reserved ZFS filesystem: sandbox store +
      # org/handle/uid ledger share one sqlite file. No private key material is persisted.
      SANDBOX_ALLOCATION_DB: /var/lib/sandboxd/state.sqlite3
      SANDBOX_STATE_DB: /var/lib/sandboxd/state.sqlite3
      SANDBOXD_SECRET_RUNTIME_ROOT: /run/sandboxd-secrets
      # Fixed control-only bridge; each tenant instead receives its own labeled `csn_*` bridge.
      SANDBOX_INGRESS_NETWORK: cs-ingress
      SANDBOX_NETWORK_POOL: 10.192.0.0/10
      SANDBOX_NETWORK_PREFIXLEN: "29"
      SANDBOXD_REQUIRE_NETWORK_FIREWALL: "1"
      SANDBOXD_FIREWALL_HELPER_IMAGE: ghcr.io/dmvt/confidential-sandboxes@sha256:097ca556c69a75e454810fee718e5c5412b6c266aeb5cf36b5c044ff03faa12b
      SANDBOXD_FIREWALL_WATCHDOG_INTERVAL_SECONDS: "15"
      # Preview URLs (/app/{id}/…) are capability URLs reachable without the daemon bearer; /_api/*
      # stays bearer-gated.
      SANDBOX_APP_PUBLIC: "1"
      # Production app traffic is host-only. Every sandbox receives a high-entropy sibling hostname;
      # the shared /app/{id} route is disabled so tenants cannot share a browser origin.
      SANDBOXD_REQUIRE_UNIQUE_APP_ORIGINS: "1"
      SANDBOX_APPS_DOMAIN: ${APP_DOMAIN:?set to the dedicated sandbox wildcard domain}
      SANDBOXD_PUBLIC_HTTPS_PORTS: "443,8787"
      # One-shot image to chown a fresh per-sandbox /data volume to the tenant uid (65534) so the
      # attested durable writable area is writable under read-only rootfs + non-root user.
      SANDBOX_VOLUME_INIT_IMAGE: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      SANDBOXD_ALLOWED_RUNTIMES: runsc
      SANDBOXD_RUNSC_DIGEST: sha512:9efeefada7b9a7bcc21dc3a1ad3531d11dfac267808cced45d047aab742f15ecb91b2bb635dea78a4ae36817f76e5ed223b7ad80f3165f15dd24de9b0c95726f
      SANDBOXD_MIN_RUNSC_CPU_MILLIS: "100"
      SANDBOXD_MIN_RUNSC_MEMORY_MB: "128"
      SANDBOXD_MIN_RUNSC_PIDS: "128"
      SANDBOXD_MIN_RUNSC_DISK_MB: "16"
      # Fixed admission budgets for BOX_VCPU=8 / BOX_MEM=16384 / BOX_DISK=300. Tenant plus trusted
      # service maxima total 7.25 vCPU / 14.25 GiB including the source builder and build tmpfs,
      # leaving host dockerd/OS/ZFS CPU and memory headroom. Tenant PIDs
      # are hard-capped at 16,384. The 251 GiB XFS zvol sells 232 GiB, preserves 18 GiB of usable
      # reserve, and absorbs its own filesystem metadata in the remaining space.
      HOST_VCPU_MILLIS: "5000"
      HOST_MEMORY_MB: "10240"
      HOST_DISK_MB: "237568"
      HOST_PIDS: "16384"
      HOST_MAX_SANDBOXES: "50"
      HOST_CPU_OVERCOMMIT: "1.0"
      HOST_MEMORY_OVERCOMMIT: "1.0"
      HOST_DISK_OVERCOMMIT: "1.0"
      SANDBOXD_REQUIRE_CAPACITY: "1"  # fail closed if any production ceiling is invalid/missing
      SANDBOX_DISK_ROOT: /var/lib/sandboxd-data
      SANDBOXD_REQUIRE_DISK_QUOTA: "1"  # fail closed unless XFS project quotas enforce /data
      # Registry creds (CVM-sealed) so the daemon can pull PRIVATE images for runsc workloads.
      DSTACK_DOCKER_USERNAME: ${DSTACK_DOCKER_USERNAME}
      DSTACK_DOCKER_PASSWORD: ${DSTACK_DOCKER_PASSWORD}
      DSTACK_DOCKER_REGISTRY: ${DSTACK_DOCKER_REGISTRY}
    networks:
      cs-ingress:
        ipv4_address: 10.191.255.250
        aliases:
          # The pinned Caddy image's measured upstream name is frontproxy:8088.
          - frontproxy
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - sandboxd-buildkit-socket:/run/buildkit
      # Same absolute host/CVM path: plaintext exists only on the guest's /run tmpfs and dockerd can
      # bind the per-sandbox file read-only without copying values into Docker Config.Env.
      - /run/sandboxd-secrets:/run/sandboxd-secrets
      # Pre-launch creates this as dstack/sandboxd-state with exact 2 GiB quota, refquota, and
      # refreservation. It remains writable even if the separate Docker data-root reaches its cap.
      - type: bind
        source: /var/lib/sandboxd-state
        target: /var/lib/sandboxd
        bind:
          create_host_path: false
      # xfs_quota must resolve the XFS backing device. Only this trusted daemon receives /dev.
      - /dev:/dev
      # Host pre-launch provisions this as dedicated XFS+prjquota. Same absolute path is required
      # because tenant bind mounts are resolved by the host Docker daemon.
      - /var/lib/sandboxd-data:/var/lib/sandboxd-data
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - no-new-privileges:true
    ports:
      # Preserve the existing dstack gateway/control URL while moving the in-container listener to
      # the Caddy image's fixed upstream port.
      - "8080:8088"
    depends_on:
      sandbox-builder:
        condition: service_healthy

  # Unique-origin TLS ingress. The image is the exact digest currently used by the production
  # webhost; wildcard certificates are obtained through a sealed, zone-scoped Cloudflare token.
  tlsproxy:
    image: ghcr.io/dmvt/webhost-tlsproxy@sha256:8fc8545f084f63977a635845d594a2574efafc4b0f2bd514c9704c6f509bf83b
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
      - /run:rw,nosuid,nodev,noexec,size=16m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?sealed Cloudflare DNS token required}
      SANDBOX_APPS_DOMAIN: ${APP_DOMAIN:?set to sandbox.synclave.net}
    # Override the webhost image's broader default config with one measured, minimal wildcard. The
    # doubled dollar survives Compose interpolation for Caddy's own environment substitution.
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        cat > /tmp/Caddyfile <<'CADDYFILE'
        {
          admin off
          acme_dns cloudflare {env.CLOUDFLARE_API_TOKEN}
          servers {
            max_header_size 32KB
            timeouts {
              read_body 30s
              read_header 10s
              # sandboxd bounds MCP/SSE proxy requests at one hour; leave TLS-proxy headroom so
              # the application layer, not Caddy, owns reconnect timing.
              write 65m
              idle 30s
            }
          }
        }
        # MCP servers conventionally bind :8787. Both listeners terminate the same wildcard TLS
        # certificate and dispatch by the sandbox hostname, so tenants cannot collide on the
        # shared external port. Sandboxd still selects each tenant's declared container port.
        *.{$$SANDBOX_APPS_DOMAIN}, *.{$$SANDBOX_APPS_DOMAIN}:8787 {
          log {
            output stdout
            format json
          }
          @sandbox_host header_regexp Host ^sbx-[0-9a-f]{52}[.]{$$SANDBOX_APPS_DOMAIN}(?::8787)?$
          handle @sandbox_host {
            reverse_proxy frontproxy:8088 {
              header_up Accept-Encoding identity
              header_up -Forwarded
              header_up -X-Forwarded-*
              header_up -X-Real-IP
              header_up Host {http.request.host}
              header_up X-Forwarded-For {http.request.remote.host}
              header_up X-Forwarded-Host {http.request.host}
              header_up X-Forwarded-Proto https
              transport http {
                dial_timeout 5s
                response_header_timeout 30s
                keepalive_idle_conns_per_host 16
              }
            }
          }
          handle {
            abort
          }
        }
        CADDYFILE
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports:
      - "443:443"
      - "8787:8787"
    volumes:
      - sandboxd-caddy-data:/data
      - sandboxd-caddy-config:/config
    depends_on:
      sandboxd:
        condition: service_healthy
    networks:
      - cs-ingress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  registration-calldata:
    image: ghcr.io/dmvt/attestmesh-indexer@sha256:d99b1d207e0df8bfdf6fbac5b001142307475ac9a5b1b88b730b7edabd4283e5
    restart: "no"
    init: true
    stop_grace_period: 15s
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
      - /run:rw,nosuid,nodev,noexec,size=8m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    depends_on:
      - sidecar
    entrypoint: ["/usr/local/bin/attestmesh-registration-calldata"]
    environment:
      - CLUSTER=${CLUSTER}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - REGISTRATION_HELPER_ADDR=0.0.0.0:9092
    ports:
      - "9092:9092"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro

networks:
  # Fixed control plane. Tenant `csn_*` bridges are separate and come from 10.192.0.0/10.
  cs-ingress:
    name: cs-ingress
    ipam:
      config:
        - subnet: 10.191.255.248/29
  # The builder has public egress for ordinary package installation but no Compose-level path to
  # sandboxd/sidecar. Pre-launch filters private, link-local, metadata, and host destinations on the
  # stable bridge interface before this measured service can start.
  build-egress:
    name: sandboxd-build-egress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: csbuild0
    ipam:
      config:
        - subnet: 172.30.255.0/29

volumes:
  sidecar-state:
  sandboxd-caddy-data:
  sandboxd-caddy-config:
  sandboxd-buildkit-socket:
  sandboxd-builder-tools:
