# pocket-mcp node: the app tier for the Pocket recording store — a 2-min poller that
# imports completed+summarized recordings into Postgres+pgvector (with Hindsight as a
# memory layer), plus an MCP server that exposes them. Mesh-only app surface: gateway is
# ON at the node level, but NOTHING is published except the sidecar's
# :9090 (health) and :51900 (wg transport). Runs on cluster C3 alongside its backing
# stores (external HA Postgres+pgvector and external HA Hindsight), with Redpill Qwen
# used only for embeddings.
#
# Roles (one image ghcr.io/attestmesh/pocket-mcp, command per service):
#   pg-provision : ensure role+db `pocket` + pgvector on pg-ha (pg-ha image, CSK superuser)
#   init         : python scripts/init_db.py   — create schema; pgvector column = vector(EMBEDDING_DIM)
#   poller       : python -m poller            — 2-min loop: Pocket API -> pg+pgvector+outbox
#   outbox       : python -m server.outbox     — disabled-by-default Hindsight writer
#   mcp          : python -m server.mcp_server — MCP over HTTP/SSE on :20800 (owns the app netns)
#
# Network shape (mirrors agent-session-mcp-node.yaml):
#   - `mcp` owns the app netns; `poller` and the egress firewall join it
#     (network_mode: service:mcp). It is deny-all egress EXCEPT: the pg-ha DB forwarders,
#     the Hindsight forwarder, the Pocket API host, and Redpill's pinned embedding CIDR on :443.
#   - The app CANNOT share the sidecar netns: the sidecar needs open egress to Base RPC /
#     bundler / gateway for on-chain registration, which the app egress lock would break.
#     Mesh services are reached through sidecar-netns socat forwarders (sidecar:1543N ->
#     pg-ha and sidecar:18888 -> Hindsight), and the MCP
#     endpoint is surfaced back onto the wg mesh IP by a mesh-proxy socat.
#
# Secrets: NO values are committed here. deploy/pocket-mcp-node.sh seals each ${VAR} below
# as an individual measured env (dstack app-compose does NOT support env_file). Only the
# app-role Postgres password + Redpill embedding key + Hindsight token + Pocket
# API key ride sealed; the pg-ha SUPERUSER password is CSK-derived in-CVM by pg-provision
# and never leaves the mesh.
services:
  sidecar:
    image: ghcr.io/attestmesh/cluster-mesh-agent@sha256:e3d53442aa6e52d47227fb3528c1141302ad4fc63c4b3fb6dc38df7ce907d486
    restart: unless-stopped
    environment:
      # MEMBER_CONTRACT intentionally unset: the sidecar self-discovers the app_id.
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - SIDECAR_STATE_DIR=/var/lib/attestmesh
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - sidecar-state:/var/lib/attestmesh
      - agent-sock:/var/run/attestmesh
    ports:
      - "9090:9090"
      - "51900:51900"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  # One-shot: ensure role + database `pocket` on the pg-ha cluster AND enable pgvector in
  # it. Superuser password is CSK-derived in-CVM (attestmesh.pgha.superuser.v1); the
  # app-role password arrives sealed. Idempotent (create-if-missing + ALTER to converge) —
  # re-runs on every boot. Uses the r6 pg-ha image (has pgvector). pg mesh IPs from
  # deploy/logs/pg-ha-pg-ha.state (chain-derived, permanent members).
  pg-provision:
    image: ghcr.io/attestmesh/pg-ha@sha256:3cce594b31cc9c57dea6f1b7fc4e6a3e9b31be15853c49e22c4c6423d7a9b066 # r6 (pgvector)
    restart: on-failure
    network_mode: service:sidecar
    depends_on:
      - sidecar
    environment:
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - PGHA_STATUS_FILE=/tmp/pg-provision.status
      - PGHA_LOG_TAG=pg-provision
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    volumes:
      - agent-sock:/var/run/attestmesh
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        source /usr/local/bin/pgha-common.sh
        _st "deriving pg-ha superuser credential (waits for CSK)"
        SUPW="$$(csk_derive attestmesh.pgha.superuser.v1)"
        HOSTS="10.18.147.86:5432,10.18.251.71:5432,10.18.172.186:5432"
        _st "ensuring role + database pocket"
        psql "postgresql://postgres:$${SUPW}@$${HOSTS}/postgres?connect_timeout=5" -v ON_ERROR_STOP=1 -v apw="$$APP_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE pocket LOGIN PASSWORD %L', :'apw')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'pocket')
        \gexec
        ALTER ROLE pocket WITH LOGIN PASSWORD :'apw';
        SELECT format('CREATE DATABASE %I OWNER %I', 'pocket', 'pocket')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'pocket')
        \gexec
        SQL
        _st "enabling pgvector in pocket"
        psql "postgresql://postgres:$${SUPW}@$${HOSTS}/pocket?connect_timeout=5" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
        psql -w "postgresql://pocket:$${APP_DB_PASSWORD}@$${HOSTS}/pocket?connect_timeout=5" -c 'select 1' >/dev/null
        _st "OK: role + database pocket + pgvector ensured; login verified"

  # :15431 routes directly to Patroni's writable primary; :15432/3 retain
  # node-specific HAProxy fallbacks for libpq multi-host reconnects.
  pg-primary-router:
    image: haproxy:3.0-alpine@sha256:dee54db8b27cd6c21519ea4f0ba0604f3742e8e7369bc16fb5b69133dec3f47f
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat >/tmp/pg-primary-router.cfg <<'CFG'
        global
          maxconn 400
        defaults
          mode tcp
          timeout connect 2s
          timeout client 30m
          timeout server 30m
          timeout check 2s
          retries 2
          option redispatch
        listen primary
          bind 0.0.0.0:15431
          option httpchk GET /primary
          http-check expect status 200
          # Do not tear down live database sessions for one transient Patroni
          # health miss; three misses still detect a real primary loss in 600ms.
          default-server inter 200ms fastinter 100ms downinter 500ms fall 3 rise 1 on-marked-down shutdown-sessions
          server pg1 10.18.147.86:5434 check port 8008
          server pg2 10.18.251.71:5434 check port 8008
          server pg3 10.18.172.186:5434 check port 8008
        CFG
        exec haproxy -f /tmp/pg-primary-router.cfg -db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pg2-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:15432,fork,reuseaddr,bind=0.0.0.0", "TCP:10.18.251.71:5432"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pg3-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:15433,fork,reuseaddr,bind=0.0.0.0", "TCP:10.18.172.186:5432"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Forwarder to the current Hindsight node mesh API. The app reaches it at
  # sidecar:18888 (HINDSIGHT_URL) and presents the sealed tenant Bearer token.
  hindsight-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:18888,fork,reuseaddr,bind=0.0.0.0", "TCP:${HINDSIGHT_MESH_IP}:18888"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Qwen embeddings reach Redpill only through the persistent, metered budget proxy.
  budget-proxy-forwarder:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:18889,fork,reuseaddr,bind=0.0.0.0", "TCP:${HINDSIGHT_MESH_IP}:18889"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # One-shot: create the schema (idempotent). Runs in the SIDECAR netns — like pg-provision —
  # NOT the app netns, so poller/mcp can hard-wait on it (service_completed_successfully)
  # without a netns dependency cycle. EMBEDDING_DIM is REQUIRED here: init_db renders the
  # pgvector column as vector(EMBEDDING_DIM) and the width is fixed at table creation. Egress
  # is unlocked here, but init_db only runs DDL — no recording text or embeddings flow.
  init:
    image: ghcr.io/attestmesh/pocket-mcp@sha256:471a99c04123ae6461d5f177fc570d5457bf4411309c4bab3ad0b5e90f75d1e4
    restart: on-failure
    network_mode: service:sidecar
    depends_on:
      pg-provision:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HINDSIGHT_URL=${HINDSIGHT_URL}
      - HINDSIGHT_TOKEN=${HINDSIGHT_TOKEN}
      - HINDSIGHT_BANK=${HINDSIGHT_BANK}
      - HINDSIGHT_SYNC_ENABLED=${HINDSIGHT_SYNC_ENABLED}
      - EMBEDDING_URL=${EMBEDDING_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - POCKET_API_KEY=${POCKET_API_KEY}
      - POCKET_API_BASE=${POCKET_API_BASE}
      - LOG_LEVEL=info
    command: ["python", "scripts/init_db.py"]

  # MCP server (:20800) over HTTP/SSE. Owns the app netns; poller + egress-fw join it.
  # Waits on the schema barrier. Reaches pg via sidecar:1543N, Hindsight via sidecar:18888,
  # and metered Qwen via sidecar:18889. MCP_AUTH_TOKEN is optional
  # (empty = mesh membership is the trust boundary in v1).
  mcp:
    # Exact base application plus bounded, idempotent read retry during Patroni failover.
    image: ghcr.io/attestmesh/pocket-mcp-failover@sha256:7097e0149a58b4c70970a0d8e42876fcb2ef884b2bb51b9fb17c00e2b2e0ce5f
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HINDSIGHT_URL=${HINDSIGHT_URL}
      - HINDSIGHT_TOKEN=${HINDSIGHT_TOKEN}
      - HINDSIGHT_BANK=${HINDSIGHT_BANK}
      - HINDSIGHT_SYNC_ENABLED=${HINDSIGHT_SYNC_ENABLED}
      - RECALL_BACKEND=${RECALL_BACKEND}
      - EMBEDDING_URL=${EMBEDDING_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=20800
      - LOG_LEVEL=info
    expose:
      - "20800"
    command: ["python", "-m", "server.mcp_server"]

  # Poller (2-min loop). Joins mcp's netns/egress. Waits on the schema barrier. Reaches the
  # Pocket API (external :443), pg via sidecar:1543N, metered Qwen via sidecar:18889, and Hindsight via
  # sidecar:18888 (synchronization remains disabled during recovery).
  poller:
    image: ghcr.io/attestmesh/pocket-mcp@sha256:471a99c04123ae6461d5f177fc570d5457bf4411309c4bab3ad0b5e90f75d1e4
    restart: unless-stopped
    network_mode: service:mcp
    depends_on:
      mcp:
        condition: service_started
      init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HINDSIGHT_URL=${HINDSIGHT_URL}
      - HINDSIGHT_TOKEN=${HINDSIGHT_TOKEN}
      - HINDSIGHT_BANK=${HINDSIGHT_BANK}
      - HINDSIGHT_SYNC_ENABLED=${HINDSIGHT_SYNC_ENABLED}
      - EMBEDDING_URL=${EMBEDDING_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIM=${EMBEDDING_DIM}
      - POCKET_API_KEY=${POCKET_API_KEY}
      - POCKET_API_BASE=${POCKET_API_BASE}
      - LOG_LEVEL=info
    command: ["python", "-m", "poller"]

  # Sole Hindsight writer; starts in a hard-disabled Postgres-only mode.  The
  # worker adopts active jobs, caps in-flight documents at eight, and never
  # automatically retries failed/ambiguous submissions.
  hindsight-outbox:
    image: ghcr.io/attestmesh/pocket-mcp@sha256:471a99c04123ae6461d5f177fc570d5457bf4411309c4bab3ad0b5e90f75d1e4
    restart: unless-stopped
    network_mode: service:mcp
    depends_on:
      mcp:
        condition: service_started
      init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HINDSIGHT_URL=${HINDSIGHT_URL}
      - HINDSIGHT_TOKEN=${HINDSIGHT_TOKEN}
      - HINDSIGHT_BANK=${HINDSIGHT_BANK}
      - HINDSIGHT_SYNC_ENABLED=${HINDSIGHT_SYNC_ENABLED}
      - HINDSIGHT_OUTBOX_MAX_IN_FLIGHT=${HINDSIGHT_OUTBOX_MAX_IN_FLIGHT}
      - HINDSIGHT_OUTBOX_TICK_SECONDS=${HINDSIGHT_OUTBOX_TICK_SECONDS}
      - HINDSIGHT_OUTBOX_RUN_LIMIT=${HINDSIGHT_OUTBOX_RUN_LIMIT}
      - LOG_LEVEL=info
    command: ["python", "-m", "server.outbox"]

  # App egress is deny-by-default: pg-ha/Hindsight/budget forwarders, the Pocket API
  # host, and Docker DNS. Uses the c6c00d1f image — it
  # honors INTERNAL_HOST_PORTS; the external-only c75c9668 image silently ignores it.
  app-egress-fw:
    image: ghcr.io/attestmesh/agent-egress-fw@sha256:c6c00d1fc5e73dde050c1a8cf2fef43a93cc9cd0dc0f5f368e7c763f1f1c242c
    restart: unless-stopped
    network_mode: service:mcp
    depends_on:
      - mcp
    environment:
      - ALLOW_BASE_URL=${POCKET_API_BASE}
      - ALLOW_PORT=443
      # Optional pinned CIDR(s) for the Pocket API (resolution-independent). Empty => rely
      # on ALLOW_BASE_URL DNS re-resolution every RERESOLVE_SECONDS.
      - ALLOW_CIDRS=${POCKET_API_CIDRS}
      - INTERNAL_HOSTS=
      - INTERNAL_HOST_PORTS=sidecar:15431 sidecar:15432 sidecar:15433 sidecar:18888 sidecar:18889
      - ALLOW_DNS=127.0.0.11
      - RERESOLVE_SECONDS=30
    cap_add:
      - NET_ADMIN

  # Surface the MCP server on the wireguard mesh IP so cluster members (agents) reach
  # <mesh-ip>:20800/<path>. Bound only to attestmesh0 inside the sidecar netns. The socat is
  # path-agnostic; the real MCP path (/sse today, /mcp if streamable-HTTP) is a client
  # concern — see the runbook. mcp:20800 is reachable because mcp owns the app netns.
  mesh-proxy-mcp:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
      - mcp
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        while :; do
          ip="$(ip -4 -o addr show dev attestmesh0 2>/dev/null | awk '{print $$4}' | cut -d/ -f1)"
          [ -n "$$ip" ] && break
          sleep 1
        done
        exec socat TCP-LISTEN:20800,fork,reuseaddr,bind="$${ip}" TCP:mcp:20800
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Registration helper: computes this app's dstack_register calldata and serves it on :9092
  # for the operator-driven direct-register path. Required because the box AA bundler is dead,
  # so the sidecar cannot self-register a NEW member via BUNDLER_URL. Same block as
  # hermes / sandboxd / db-ha / indexer-member nodes (was omitted when modeled on
  # agent-session-mcp, which had registered earlier while the bundler still worked).
  registration-calldata:
    image: ghcr.io/dmvt/attestmesh-indexer@sha256:d99b1d207e0df8bfdf6fbac5b001142307475ac9a5b1b88b730b7edabd4283e5
    restart: "no"
    depends_on:
      - sidecar
    entrypoint: ["/usr/local/bin/attestmesh-registration-calldata"]
    environment:
      - CLUSTER=${CLUSTER}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - REGISTRATION_HELPER_ADDR=0.0.0.0:9092
    ports:
      - "9092:9092"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock

volumes:
  sidecar-state:
  agent-sock:
