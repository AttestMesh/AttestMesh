# Postgres HA node (one of N): Patroni + etcd + HAProxy over the AttestMesh wireguard mesh,
# plus a chain-command administrative agent. See docs/specs/pg-ha.md.
#
# The HA trio (etcd/patroni/haproxy) shares the SIDECAR netns so it can bind the mesh IP and
# reach the other pg nodes over attestmesh0 — etcd peers, Patroni's DCS + REST, replication,
# and HAProxy health checks are all mesh flows. Mesh clients connect to ANY node's mesh IP
# :5432 (current primary) or :5433 (replicas). Postgres itself listens on 5434 so HAProxy can
# own 5432/5433 in the shared netns. No host `ports:` beyond the sidecar's wg-over-TCP 51900;
# the host-isolation invariant is asserted by deploy/pg-ha-node.sh verify-isolation-all.

services:
  sidecar:
    # Phala's pre-launch registry probe returns 404 for private GHCR digest refs;
    # this release tag includes the bounded dstack UDS HTTP response reader needed
    # by Phala's keep-alive guest agent.
    image: ghcr.io/attestmesh/cluster-mesh-agent:phala-uds-http-fix-20260718
    restart: unless-stopped
    # The CVM serial console is the only operational log sink: it is visible through
    # the deployment control plane without adding SSH or an administrative network port.
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        timeout 20 /usr/local/bin/attestmesh-registration-calldata \
          >/pgha-status/registration-helper.log 2>&1 &
        exec /usr/local/bin/cluster-mesh-agent 2>&1 | tee /pgha-status/sidecar.log
    environment:
      # MEMBER_CONTRACT intentionally unset: the sidecar self-discovers the app_id.
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - CLUSTER=${CLUSTER}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - GATEWAY_DOMAIN_OVERRIDES=${GATEWAY_DOMAIN_OVERRIDES:-}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - SIDECAR_STATE_DIR=/var/lib/attestmesh
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
      - ROLL_ID=20260702T0001Z
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - sidecar-state:/var/lib/attestmesh
      - pgha-status:/pgha-status
      - agent-sock:/var/run/attestmesh
    ports:
      - "51900:51900"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      - /dev/ttyS0:/dev/ttyS0

  # Patroni's DCS. One member per pg node; quorum forms over the mesh. Bootstrap state
  # machine (new/join/restart) lives in the entrypoint — see docs/specs/pg-ha.md §3.1.
  etcd:
    image: ghcr.io/attestmesh/pg-ha:etcd-scalein-v2-20260718
    restart: unless-stopped
    network_mode: service:sidecar
    entrypoint: ["/usr/local/bin/pgha-etcd-entrypoint.sh"]
    depends_on:
      - sidecar
    environment:
      - PGHA_NODE_NAME=${PGHA_NODE_NAME}
      - PGHA_PEERS=${PGHA_PEERS}
      - PGHA_BOOTSTRAP=${PGHA_BOOTSTRAP}
      - PGHA_ETCD_FORCE_REJOIN=${PGHA_ETCD_FORCE_REJOIN:-false}
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
    volumes:
      - etcd-data:/var/lib/etcd
      - agent-sock:/var/run/attestmesh
      - pgha-status:/pgha-status

  # Patroni-managed Postgres 16 (+ WAL-G). All cluster credentials are HKDF-derived from
  # the CSK at boot; the superuser/REST creds the admin agent needs are dropped on the
  # pgha-secrets volume. Data survives disk-preserving rolls (UpgradeApp).
  patroni:
    image: ghcr.io/attestmesh/pg-ha:etcd-scalein-v2-20260718
    restart: unless-stopped
    network_mode: service:sidecar
    entrypoint: ["/usr/local/bin/pgha-patroni-entrypoint.sh"]
    depends_on:
      - etcd
    environment:
      - PGHA_NODE_NAME=${PGHA_NODE_NAME}
      - PGHA_PEERS=${PGHA_PEERS}
      - PGHA_MESH_CIDR=${PGHA_MESH_CIDR}
      - PGHA_VERIFY_PASSWORD=${PGHA_VERIFY_PASSWORD}
      - PGHA_CRASH_RECOVERY_ONLY=${PGHA_CRASH_RECOVERY_ONLY}
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - BACKUP_ENABLED=${BACKUP_ENABLED}
      - BACKUP_PREFIX=${BACKUP_PREFIX}
      - BACKUP_RESTORE=${BACKUP_RESTORE}
      - BACKUP_DUMP_INTERVAL_SECONDS=${BACKUP_DUMP_INTERVAL_SECONDS:-21600}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      # Backups never leave through the mesh. Each member has a node-local,
      # CSK-keyed encrypting gateway which alone talks to upstream R2.
      - R2_ENDPOINT=http://127.0.0.1:19000
      - R2_BUCKET=${R2_BUCKET}
      - R2_REGION=${R2_REGION}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - agent-sock:/var/run/attestmesh
      - pgha-status:/pgha-status
      - pgha-secrets:/pgha-secrets

  # Loopback-only S3 endpoint for WAL-G and logical dumps. This shares the
  # sidecar/Patroni netns, but the encrypting gateway itself retains a separate
  # namespace so its deny-by-default egress firewall cannot affect Postgres.
  s3-local-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
      - s3gw
    command: ["TCP-LISTEN:19000,fork,reuseaddr,bind=127.0.0.1", "TCP:s3gw:19000"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # rclone serve-s3 over a CSK-derived crypt remote. Every PG member derives the
  # same crypt key, so whichever node Patroni promotes can continue the same
  # backup history. No gateway listener is exposed on the mesh or CVM bridge.
  s3gw:
    image: ghcr.io/attestmesh/r2host-s3gw:pgha-bucket-r2-v2-20260717
    restart: unless-stopped
    depends_on:
      - sidecar
    environment:
      - R2_ENDPOINT=${R2_UPSTREAM_ENDPOINT}
      - R2_BUCKET=${R2_UPSTREAM_BUCKET}
      - R2_REGION=${R2_UPSTREAM_REGION}
      - R2_ACCESS_KEY_ID=${R2_UPSTREAM_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_UPSTREAM_SECRET_ACCESS_KEY}
      - S3GW_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - S3GW_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - S3GW_LISTEN_PORT=19000
      - S3GW_DEFAULT_BUCKET=${R2_BUCKET}
      - S3GW_VFS_CACHE_MODE=writes
      - S3GW_VFS_CACHE_MAX_SIZE=20G
      - S3GW_STATUS_FILE=/pgha-status/s3gw
      - S3GW_RCLONE_LOG=/pgha-status/s3gw-rclone.log
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
    volumes:
      - agent-sock:/var/run/attestmesh
      - pgha-status:/pgha-status
      - s3gw-cache:/vfs-cache
    expose:
      - "19000"

  s3gw-egress-fw:
    image: ghcr.io/attestmesh/agent-egress-fw:phala-rotation-20260718
    restart: unless-stopped
    network_mode: service:s3gw
    depends_on:
      - s3gw
    environment:
      - ALLOW_BASE_URL=${R2_UPSTREAM_ENDPOINT}
      - INTERNAL_HOSTS=
      - ALLOW_DNS=127.0.0.11
      - RERESOLVE_SECONDS=30
    cap_add:
      - NET_ADMIN

  # Primary/replica routing on the mesh IP. Backend health = Patroni's public role GETs.
  haproxy:
    image: ghcr.io/attestmesh/pg-ha:etcd-scalein-v2-20260718
    restart: unless-stopped
    network_mode: service:sidecar
    entrypoint: ["/usr/local/bin/pgha-haproxy-entrypoint.sh"]
    depends_on:
      - patroni
    environment:
      - PGHA_NODE_NAME=${PGHA_NODE_NAME}
      - PGHA_PEERS=${PGHA_PEERS}
    volumes:
      - pgha-status:/pgha-status

  # Mesh-only status page (:8009): the TEE blocks container logs, so every pg-ha entrypoint
  # self-reports to /pgha-status and this serves it read-only to mesh peers for debugging.
  status-server:
    image: ghcr.io/attestmesh/pg-ha:andrew-xyn-20260716
    restart: unless-stopped
    network_mode: service:sidecar
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        while :; do
          ip="$(ip -4 -o addr show dev attestmesh0 2>/dev/null | awk '{print $$4}' | cut -d/ -f1)"
          [ -n "$$ip" ] && break
          sleep 1
        done
        exec python3 -m http.server 8009 --bind "$$ip" --directory /pgha-status
    depends_on:
      - sidecar
    environment:
      - PGHA_NODE_NAME=${PGHA_NODE_NAME}
    volumes:
      - pgha-status:/pgha-status:ro

  # The TEE suppresses ordinary container logs. Mirror only bounded backup/HA
  # status files to the CVM serial console so backup failures are observable
  # without SSH, a debug port, or another mesh member.
  status-console:
    image: alpine:3.20
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while :; do
          for f in /pgha-status/state /pgha-status/walg /pgha-status/s3gw /pgha-status/s3gw-rclone.log /pgha-status/registration-helper.log /pgha-status/sidecar.log /pgha-status/patroni-*.log /pgha-status/pglog/postgresql-*.log /pgha-status/crash-recovery-*.log; do
            [ -f "$$f" ] || continue
            echo "=== pgha-status:$$f ===" >/dev/ttyS0
            tail -n 30 "$$f" >/dev/ttyS0 2>&1 || true
          done
          sleep 30
        done
    volumes:
      - pgha-status:/pgha-status:ro
    devices:
      - /dev/ttyS0:/dev/ttyS0

  # One-shot, explicitly sealed disaster-recovery control. Empty during normal
  # operation. When Patroni has no leader, an operator may name the verified
  # recovery candidate; the request stays inside the node-local REST endpoint.
  patroni-recovery:
    image: curlimages/curl:8.12.1
    restart: "no"
    network_mode: service:sidecar
    depends_on:
      - patroni
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        candidate="$${PGHA_RECOVERY_CANDIDATE:-}"
        [ -n "$$candidate" ] || exit 0
        pw="$$(cat /pgha-secrets/patroni-api)"
        while :; do
          code="$$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            -u "patroni:$$pw" -H 'content-type: application/json' \
            -d "{\"candidate\":\"$$candidate\"}" \
            http://127.0.0.1:8008/failover || true)"
          case "$$code" in 200|202) exit 0;; esac
          sleep 5
        done
    environment:
      - PGHA_RECOVERY_CANDIDATE=${PGHA_RECOVERY_CANDIDATE}
    volumes:
      - pgha-secrets:/pgha-secrets:ro

  # Decrypted MessageFacet consumer. Redpill is advisory-only; the receiver validates sender,
  # target, expiry, UUID replay key, and a closed command allowlist before reading diagnostics.
  pgha-command-agent:
    image: ghcr.io/attestmesh/pg-ha-command-agent:andrew-xyn-20260716
    restart: unless-stopped
    depends_on:
      - patroni
    environment:
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - PGHA_NODE_NAME=${PGHA_NODE_NAME}
      - PGHA_CLUSTER_NAME=${PGHA_CLUSTER_NAME:-andrew-xyn-pg}
      - PGHA_SAFE_ADDRESS=${PGHA_SAFE_ADDRESS}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
    volumes:
      - agent-sock:/var/run/attestmesh:ro
      - pgha-status:/pgha-status:ro
      - pgha-command-replay:/var/lib/pgha-command-agent

  # The command agent can reach only the node-local sidecar/Patroni endpoint and redpill.
  command-agent-egress-fw:
    image: ghcr.io/attestmesh/agent-egress-fw:phala-rotation-20260718
    restart: unless-stopped
    network_mode: service:pgha-command-agent
    depends_on:
      - pgha-command-agent
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_ALLOW_CIDRS=66.220.6.0/24
      - INTERNAL_HOSTS=sidecar
      - ALLOW_DNS=127.0.0.11
      - RERESOLVE_SECONDS=15
    cap_add:
      - NET_ADMIN

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    user: root
    volumes:
      - prometheus-data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/prometheus/prometheus.yml <<'PROMYML'
        global:
          scrape_interval: 15s
          scrape_timeout: 10s
        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ['localhost:9090']
          - job_name: node
            static_configs:
              - targets: ['node-exporter:9100']
          - job_name: cadvisor
            static_configs:
              - targets: ['cadvisor:8080']
        PROMYML
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=3h \
          --storage.tsdb.retention.size=512MB \
          --web.listen-address=0.0.0.0:9090

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --web.listen-address=0.0.0.0:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    command:
      - --listen_ip=0.0.0.0
      - --port=8080
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

volumes:
  sidecar-state:
  pgdata:
  etcd-data:
  agent-sock:
  pgha-status:
  pgha-secrets:
  prometheus-data:
  pgha-command-replay:
  s3gw-cache:
