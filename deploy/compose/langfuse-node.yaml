# Langfuse node: Langfuse v3 observability (web + worker) extracted OUT of the fugu-router
# node into its own mesh-only AttestMesh node on C3 — the clean-slate fix for the fugu
# deploy's open 401 (api_keys fast_hashed_secret_key mismatch after ~15 debug rolls; see
# deploy/fugu-router-runbook.md "Known issues" #1): LANGFUSE_INIT rebuilds org/project/keys
# deterministically on a node that never churns. All data services are EXTERNAL cluster
# nodes reached over the wireguard mesh via sidecar-netns socat forwarders: pg-ha
# (Postgres), redis-ha (langfuse queue), clickhouse-ha (analytics), r2-host (S3 event/
# media store). Bridge networking; nothing published except sidecar :9090 (health) +
# :51900 (wg transport).
#
# GATEWAY MUST BE ON for this node ("HA clusters need gateway on" lesson): the wg
# transport is DIAL-OUT-ONLY over the gateway's <app_id>-51900s TLS-passthrough, and this
# node is dialed by the GATEWAY-OFF fugu-router (its langfuse callback flushes here).
# Two gateway-off nodes can never establish an intra-mesh wg link — so this side keeps
# gateway_enabled=true (and no_instance_id=false: the pair boot-loops on dstack 0.5.11).
#
# Mesh endpoints:  <mesh-ip>:18420 = Langfuse UI/API (litellm callback target + humans)
# Tailnet:         https://langfuse-N.tail39cb2e.ts.net -> langfuse-web ONLY (ts-firewall
#                  scopes the tailscale iface to :443; everything else stays mesh-only).
#
# Auth derivation: the pg-ha superuser + redis-ha + clickhouse-ha client passwords are
# HKDF-derived from the CSK IN-CVM (csk_derive attestmesh.{pgha.superuser,redisha.auth,
# chha.client}.v1) — they never ride the sealed env. The stock langfuse images get theirs
# from the csk-derive one-shot below via the derived-secrets volume + a tiny sh wrapper.

services:
  sidecar:
    image: ghcr.io/attestmesh/cluster-mesh-agent@sha256:b9e0ae107d9db015c22059c9fecdc28f2b35e09b257eabb4739bd4e46d96f641
    restart: unless-stopped
    environment:
      # MEMBER_CONTRACT intentionally unset: the sidecar self-discovers the app_id.
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - SIDECAR_STATE_DIR=/var/lib/attestmesh
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - sidecar-state:/var/lib/attestmesh
      - agent-sock:/var/run/attestmesh
    ports:
      - "9090:9090"
      - "51900:51900"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  # ── :15431 follows Patroni's writable primary; :15432/3 remain node fallbacks. ──
  pg-primary-router:
    image: haproxy:3.0-alpine@sha256:dee54db8b27cd6c21519ea4f0ba0604f3742e8e7369bc16fb5b69133dec3f47f
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat >/tmp/pg-primary-router.cfg <<'CFG'
        global
          maxconn 400
        defaults
          mode tcp
          timeout connect 2s
          timeout client 30m
          timeout server 30m
          timeout check 2s
          retries 2
          option redispatch
        listen primary
          bind 0.0.0.0:15431
          option httpchk GET /primary
          http-check expect status 200
          default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
          server pg1 10.18.147.86:5434 check port 8008
          server pg2 10.18.251.71:5434 check port 8008
          server pg3 10.18.172.186:5434 check port 8008
        CFG
        exec haproxy -f /tmp/pg-primary-router.cfg -db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pg2-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:15432,fork,reuseaddr,bind=0.0.0.0", "TCP:10.18.251.71:5432"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pg3-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:15433,fork,reuseaddr,bind=0.0.0.0", "TCP:10.18.172.186:5432"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── redis-ha forwarders: :16379-81 -> each redis node's HAProxy :6379 (any = master).
  #    Three forwarders for node-failure tolerance. IPs sealed in by the driver from the
  #    redis-ha compute-peers state. ──
  redis1-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:16379,fork,reuseaddr,bind=0.0.0.0", "TCP:${REDIS_HA_IP_1}:6379"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  redis2-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:16380,fork,reuseaddr,bind=0.0.0.0", "TCP:${REDIS_HA_IP_2}:6379"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  redis3-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:16381,fork,reuseaddr,bind=0.0.0.0", "TCP:${REDIS_HA_IP_3}:6379"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── clickhouse-ha forwarders: :18123-5 (http) + :19001-3 (native) -> each ch node's
  #    HAProxy :8123/:9000. IPs sealed in from the clickhouse-ha compute-peers state. ──
  ch1-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        socat TCP-LISTEN:19001,fork,reuseaddr,bind=0.0.0.0 TCP:${CH_HA_IP_1}:9000 &
        exec socat TCP-LISTEN:18123,fork,reuseaddr,bind=0.0.0.0 TCP:${CH_HA_IP_1}:8123
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ch2-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        socat TCP-LISTEN:19002,fork,reuseaddr,bind=0.0.0.0 TCP:${CH_HA_IP_2}:9000 &
        exec socat TCP-LISTEN:18124,fork,reuseaddr,bind=0.0.0.0 TCP:${CH_HA_IP_2}:8123
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ch3-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        socat TCP-LISTEN:19003,fork,reuseaddr,bind=0.0.0.0 TCP:${CH_HA_IP_3}:9000 &
        exec socat TCP-LISTEN:18125,fork,reuseaddr,bind=0.0.0.0 TCP:${CH_HA_IP_3}:8123
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── r2-host forwarder: :19000 -> the encrypting S3 gateway (mesh-only). ──
  r2-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:19000,fork,reuseaddr,bind=0.0.0.0", "TCP:10.18.163.210:19000"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # One-shot: ensure role+database `langfuse` on the pg-ha cluster (langfuse ONLY — the
  # litellm role stays owned by the fugu-router node). Superuser password is CSK-derived
  # in-CVM; the service password arrives sealed. Idempotent (create-if-missing + ALTER to
  # converge) — re-runs on every boot.
  pg-provision:
    image: ghcr.io/attestmesh/pg-ha@sha256:05c6d46c72f6feb444be055e1c12c116ba1334ed6d738e7d649e0ea6e71cabf5 # pinned 2026-07-02 r5
    restart: on-failure
    network_mode: service:sidecar
    depends_on:
      - sidecar
    environment:
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - PGHA_STATUS_FILE=/derived/pg-provision.status
      - PGHA_LOG_TAG=pg-provision
      - LANGFUSE_DB_PASSWORD=${LANGFUSE_DB_PASSWORD}
    volumes:
      - agent-sock:/var/run/attestmesh
      - derived-secrets:/derived
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        source /usr/local/bin/pgha-common.sh
        _st "deriving pg-ha superuser credential (waits for CSK)"
        SUPW="$$(csk_derive attestmesh.pgha.superuser.v1)"
        HOSTS="10.18.147.86:5432,10.18.251.71:5432,10.18.172.186:5432"
        _st "ensuring role + database langfuse"
        psql "postgresql://postgres:$${SUPW}@$${HOSTS}/postgres?connect_timeout=5" -v ON_ERROR_STOP=1 -v fpw="$$LANGFUSE_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE langfuse LOGIN PASSWORD %L', :'fpw')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'langfuse')
        \gexec
        ALTER ROLE langfuse WITH LOGIN PASSWORD :'fpw';
        SELECT format('CREATE DATABASE %I OWNER %I', 'langfuse', 'langfuse')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'langfuse')
        \gexec
        SQL
        psql "postgresql://langfuse:$${LANGFUSE_DB_PASSWORD}@$${HOSTS}/langfuse?connect_timeout=5" -c 'select 1' >/dev/null
        _st "OK: role+database langfuse ensured; login verified"

  # One-shot: CSK-derive the redis-ha + clickhouse-ha client passwords onto the
  # derived-secrets volume for the STOCK langfuse images (which cannot speak the agent
  # gRPC themselves). Same derivation any C3 member performs.
  csk-derive:
    image: ghcr.io/attestmesh/pg-ha@sha256:05c6d46c72f6feb444be055e1c12c116ba1334ed6d738e7d649e0ea6e71cabf5 # pinned 2026-07-02 r5 (reused for csk_derive + grpcurl)
    restart: on-failure
    depends_on:
      - sidecar
    environment:
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - PGHA_STATUS_FILE=/derived/csk-derive.status
      - PGHA_LOG_TAG=csk-derive
    volumes:
      - agent-sock:/var/run/attestmesh
      - derived-secrets:/derived
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        source /usr/local/bin/pgha-common.sh
        _st "deriving redis-ha + clickhouse-ha client credentials (waits for CSK)"
        umask 077
        # tr -d '\n': csk_derive ends in print()'s trailing newline, but the servers set
        # their password via $(csk_derive) which strips it — the stock langfuse wrappers
        # read these with cat, so the file must be newline-free or auth mismatches.
        csk_derive attestmesh.redisha.auth.v1 | tr -d '\n' > /derived/redis-password
        csk_derive attestmesh.chha.client.v1  | tr -d '\n' > /derived/clickhouse-password
        chmod 644 /derived/redis-password /derived/clickhouse-password
        _st "OK: derived secrets written to /derived"

  # One-shot: create the `langfuse` database on the clickhouse-ha cluster. Langfuse's CH
  # migration runner checks `SHOW TABLES FROM langfuse` before creating anything and hard-
  # fails if the database is absent, so it must be pre-created (like the r2 bucket). The
  # default-user password is CSK-derived in-CVM; reaches CH via the sidecar-netns forwarder.
  # Retry + EXISTS-verify loop: the first CREATE can race the forwarder/cluster on boot.
  ch-provision:
    image: ghcr.io/attestmesh/pg-ha@sha256:05c6d46c72f6feb444be055e1c12c116ba1334ed6d738e7d649e0ea6e71cabf5 # pinned 2026-07-02 r5 (csk_derive + curl)
    restart: on-failure
    network_mode: service:sidecar
    depends_on:
      - sidecar
      - ch1-proxy
    environment:
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - PGHA_STATUS_FILE=/derived/ch-provision.status
      - PGHA_LOG_TAG=ch-provision
    volumes:
      - agent-sock:/var/run/attestmesh
      - derived-secrets:/derived
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        source /usr/local/bin/pgha-common.sh
        _st "deriving clickhouse default credential (waits for CSK)"
        CHPW="$$(csk_derive attestmesh.chha.client.v1)"
        _st "waiting for clickhouse-ha via forwarder :18123"
        for i in $$(seq 1 90); do
          curl -sf "http://localhost:18123/ping" >/dev/null 2>&1 && break
          sleep 2
        done
        _st "ensuring database langfuse ON CLUSTER default"
        ok=0
        for i in $$(seq 1 20); do
          curl -sS "http://localhost:18123/" \
            -H "X-ClickHouse-User: default" -H "X-ClickHouse-Key: $$CHPW" \
            --data-binary "CREATE DATABASE IF NOT EXISTS langfuse ON CLUSTER default" >/dev/null 2>&1 || true
          exists="$$(curl -sS -G "http://localhost:18123/" \
            -H "X-ClickHouse-User: default" -H "X-ClickHouse-Key: $$CHPW" \
            --data-urlencode "query=EXISTS DATABASE langfuse" 2>/dev/null | tr -d '[:space:]')"
          if [ "$$exists" = "1" ]; then ok=1; break; fi
          sleep 3
        done
        [ "$$ok" = "1" ] || { _st "FAILED: database langfuse not present after retries"; exit 1; }
        _st "OK: database langfuse ensured ON CLUSTER default"

  # ── fugu-router forwarder: :18410 -> the LiteLLM proxy's mesh endpoint, so the
  #    dashboard's LLM-connection / playground features can call the router. Whitelisted
  #    via LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST=sidecar (SSRF guard host-bypass). ──
  fugu-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    command: ["TCP-LISTEN:18410,fork,reuseaddr,bind=0.0.0.0", "TCP:${FUGU_ROUTER_IP}:18410"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── Langfuse v3 (web + worker). TELEMETRY_ENABLED=false and the egress-fw's enforce
  #    telemetry-off at the network layer. LANGFUSE_INIT_* makes org/project/user + the
  #    callback pk/sk deterministic and sealed (the SAME pk/sk the fugu-router litellm
  #    already sends). ClickHouse over the ch forwarders with
  #    CLICKHOUSE_CLUSTER_ENABLED=true (ON CLUSTER migrations -> ReplicatedMergeTree);
  #    Redis db 1 defaults; S3 -> r2-host via sidecar:19000, path-style, bucket
  #    PRE-CREATED (never rely on CreateBucket).
  #    NOTE: DSN is single-host sidecar:15431 (Prisma has no multi-host DSN support);
  #    the local Patroni-aware router keeps that endpoint on the writable primary.
  #    The sh wrapper reads the CSK-derived redis/CH passwords from derived-secrets and
  #    execs the stock entrypoint — keep the exec path in sync with the pinned image. ──
  langfuse-web:
    image: langfuse/langfuse:3@sha256:273ff149897aa7024b7c28254c9bd6b7a62a336ddb4476e928e89d0734b64923 # pinned 2026-07-03
    restart: unless-stopped
    depends_on:
      ch-provision:
        condition: service_completed_successfully
      csk-derive:
        condition: service_completed_successfully
      pg-provision:
        condition: service_completed_successfully
    environment: &langfuse-env
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@sidecar:15431/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - TELEMETRY_ENABLED=false
      # SSRF-guard whitelist: allow LLM connections to the compose-internal forwarder
      # (base URL http://sidecar:18410/v1 -> fugu-router over the mesh).
      - LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST=sidecar
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID}
      - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD}
      - CLICKHOUSE_URL=http://sidecar:18123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://sidecar:19001
      - CLICKHOUSE_CLUSTER_ENABLED=true
      - CLICKHOUSE_USER=default
      - REDIS_HOST=sidecar
      - REDIS_PORT=16379
      - LANGFUSE_S3_EVENT_UPLOAD_ENABLED=true
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${S3_BUCKET}
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=langfuse-events/
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://sidecar:19000
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=${S3_REGION}
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_ENABLED=true
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=${S3_BUCKET}
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=langfuse-media/
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://sidecar:19000
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=${S3_REGION}
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
    volumes:
      - derived-secrets:/derived:ro
      - debug-logs:/debug
    expose:
      - "3000"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        set +e
        export REDIS_AUTH="$$(cat /derived/redis-password)"
        export CLICKHOUSE_PASSWORD="$$(cat /derived/clickhouse-password)"
        export CLICKHOUSE_DB=langfuse
        rm -f /tmp/web-start.pipe
        mkfifo /tmp/web-start.pipe
        sed -E 's#(postgres(ql)?://)[^@[:space:]]+@#\1<redacted>@#g' \
          < /tmp/web-start.pipe > /debug/web.log &
        filter_pid=$$!
        dumb-init -- ./web/entrypoint.sh node ./web/server.js --keepAliveTimeout 110000 \
          > /tmp/web-start.pipe 2>&1
        rc=$$?
        wait "$$filter_pid" || true
        printf '\nexit=%s\n' "$$rc" >> /debug/web.log
        exit "$$rc"

  langfuse-worker:
    image: langfuse/langfuse-worker:3@sha256:ef2490d1ac96b88063deb383acec884a53efe5a9ae998432ee54ed655833f31b # pinned 2026-07-03
    restart: unless-stopped
    depends_on:
      ch-provision:
        condition: service_completed_successfully
      csk-derive:
        condition: service_completed_successfully
      pg-provision:
        condition: service_completed_successfully
    environment: *langfuse-env
    volumes:
      - derived-secrets:/derived:ro
      - debug-logs:/debug
    expose:
      - "3030"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        set +e
        export REDIS_AUTH="$$(cat /derived/redis-password)"
        export CLICKHOUSE_PASSWORD="$$(cat /derived/clickhouse-password)"
        export CLICKHOUSE_DB=langfuse
        rm -f /tmp/worker-start.pipe
        mkfifo /tmp/worker-start.pipe
        sed -E 's#(postgres(ql)?://)[^@[:space:]]+@#\1<redacted>@#g' \
          < /tmp/worker-start.pipe > /debug/worker.log &
        filter_pid=$$!
        dumb-init -- ./worker/entrypoint.sh node ./worker/dist/index.js \
          > /tmp/worker-start.pipe 2>&1
        rc=$$?
        wait "$$filter_pid" || true
        printf '\nexit=%s\n' "$$rc" >> /debug/worker.log
        exit "$$rc"

  # Temporary, mesh-only startup diagnostics. Removed after the failed process
  # has been identified; files are pre-redacted by the wrappers above.
  debug-http:
    image: alpine/socat@sha256:a6be4c0262b339c53ddad723cdd178a1a13271e1137c65e27f90a08c16de02b8
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
    volumes:
      - debug-logs:/www:ro
    command:
      - TCP-LISTEN:19090,fork,reuseaddr,bind=0.0.0.0
      - SYSTEM:for f in web worker; do echo "--- $$f"; cat "/www/$$f.log" 2>/dev/null || true; done
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Langfuse egress: ZERO external CIDRs — internal forwarders (pg/redis/ch/S3) + the
  # compose-internal worker<->web paths + Docker DNS only. Network-enforced telemetry-off.
  langfuse-web-egress-fw:
    image: ghcr.io/attestmesh/agent-egress-fw@sha256:c6c00d1fc5e73dde050c1a8cf2fef43a93cc9cd0dc0f5f368e7c763f1f1c242c
    restart: unless-stopped
    network_mode: service:langfuse-web
    depends_on:
      - langfuse-web
    environment:
      - INTERNAL_HOSTS=
      - INTERNAL_HOST_PORTS=sidecar:15431 sidecar:15432 sidecar:15433 sidecar:16379 sidecar:16380 sidecar:16381 sidecar:18123 sidecar:18124 sidecar:18125 sidecar:19001 sidecar:19002 sidecar:19003 sidecar:19000 sidecar:18410 langfuse-worker:3030
      - ALLOW_DNS=127.0.0.11
      - RERESOLVE_SECONDS=30
    cap_add:
      - NET_ADMIN

  langfuse-worker-egress-fw:
    image: ghcr.io/attestmesh/agent-egress-fw@sha256:c6c00d1fc5e73dde050c1a8cf2fef43a93cc9cd0dc0f5f368e7c763f1f1c242c
    restart: unless-stopped
    network_mode: service:langfuse-worker
    depends_on:
      - langfuse-worker
    environment:
      - INTERNAL_HOSTS=
      - INTERNAL_HOST_PORTS=sidecar:15431 sidecar:15432 sidecar:15433 sidecar:16379 sidecar:16380 sidecar:16381 sidecar:18123 sidecar:18124 sidecar:18125 sidecar:19001 sidecar:19002 sidecar:19003 sidecar:19000 sidecar:18410 langfuse-web:3000
      - ALLOW_DNS=127.0.0.11
      - RERESOLVE_SECONDS=30
    cap_add:
      - NET_ADMIN

  # ── Mesh-only endpoint, bound to the wireguard IP inside the sidecar netns. ──
  mesh-proxy-langfuse:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
      - langfuse-web
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        while :; do
          ip="$(ip -4 -o addr show dev attestmesh0 2>/dev/null | awk '{print $$4}' | cut -d/ -f1)"
          [ -n "$$ip" ] && break
          sleep 1
        done
        exec socat TCP-LISTEN:18420,fork,reuseaddr,bind="$${ip}" TCP:langfuse-web:3000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── Tailnet exposure: ONLY the Langfuse UI (matrix-node pattern). The serve config
  #    HTTPS-terminates on the tailnet :443 and proxies to langfuse-web:3000 across the
  #    compose network (tailscale keeps its OWN netns so its outbound — derp/controlplane
  #    :443, udp 41641, DNS — never widens the langfuse egress-fw). ──
  ts-serve-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ts-config:/cfg
    command:
      - /bin/sh
      - -c
      - |
        cat > /cfg/serve.json <<'JSON'
        {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://langfuse-web:3000"}}}}}
        JSON
        echo "ts-serve-init: wrote /cfg/serve.json"

  tailscale:
    image: tailscale/tailscale:v1.98.4@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0 # pinned 2026-07-03
    restart: unless-stopped
    depends_on:
      ts-serve-init:
        condition: service_completed_successfully
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=langfuse
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--netfilter-mode=off
      - TS_SERVE_CONFIG=/cfg/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ts-config:/cfg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun

  # Tailnet firewall: on tailscale0 ACCEPT only the :443 serve (+ established/icmp),
  # DROP everything else — proves "tailnet exposes ONLY Langfuse". Tailscale runs
  # --netfilter-mode=off so these rules are authoritative; re-applied every 30s.
  ts-firewall:
    image: alpine:3.20
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    cap_add:
      - NET_ADMIN
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache iptables >/dev/null 2>&1 || apk add --no-cache iptables >/dev/null 2>&1
        while ! [ -d /sys/class/net/tailscale0 ]; do sleep 2; done
        while true; do
          iptables -C INPUT -i tailscale0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT 2>/dev/null || iptables -A INPUT -i tailscale0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          iptables -C INPUT -i tailscale0 -p tcp --dport 443 -j ACCEPT 2>/dev/null || iptables -A INPUT -i tailscale0 -p tcp --dport 443 -j ACCEPT
          iptables -C INPUT -i tailscale0 -p icmp -j ACCEPT 2>/dev/null || iptables -A INPUT -i tailscale0 -p icmp -j ACCEPT
          iptables -C INPUT -i tailscale0 -j DROP 2>/dev/null || iptables -A INPUT -i tailscale0 -j DROP
          iptables -C FORWARD -i tailscale0 -j DROP 2>/dev/null || iptables -A FORWARD -i tailscale0 -j DROP
          sleep 30
        done


volumes:
  sidecar-state:
  agent-sock:
  derived-secrets:   # CSK-derived redis/CH client passwords (csk-derive -> langfuse wrappers)
  debug-logs:
  ts-state:          # tailscale node state (survives in-place rolls)
  ts-config:         # tailscale serve config (TS_SERVE_CONFIG -> HTTPS on the tailnet)
