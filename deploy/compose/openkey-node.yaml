# OpenKey API in an AttestMesh CVM. Each node owns an independent persistent
# PGlite identity store and uses the dstack guest socket for TEE key operations.
services:
  sidecar:
    image: ghcr.io/attestmesh/cluster-mesh-agent@sha256:e3d53442aa6e52d47227fb3528c1141302ad4fc63c4b3fb6dc38df7ce907d486
    restart: unless-stopped
    environment:
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - SIDECAR_STATE_DIR=/var/lib/attestmesh
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - sidecar-state:/var/lib/attestmesh
    ports:
      - "9090:9090"
      - "51900:51900"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  openkey:
    image: ghcr.io/attestmesh/openkey-api@sha256:cac7885e86da2c4533c9cb37c884d5c711ca90626479d59b0f891f77e9815efa
    restart: unless-stopped
    env_file:
      - /tmp/attestmesh-workload.env
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - openkey-data:/data
    ports:
      - "3001:3001"

  registration-calldata:
    image: ghcr.io/attestmesh/attestmesh-indexer@sha256:14e9e3f6869ada585642c14e4e2e43bee197978ffc68d146dd6d3cddbc49d2bb
    restart: "no"
    entrypoint: ["/usr/local/bin/attestmesh-registration-calldata"]
    environment:
      - CLUSTER=${CLUSTER}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - REGISTRATION_HELPER_ADDR=0.0.0.0:9092
    ports:
      - "9092:9092"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock

volumes:
  sidecar-state:
  openkey-data:
