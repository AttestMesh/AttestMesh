# OpenKey API in an AttestMesh CVM. Each node owns an independent persistent
# PGlite identity store and uses the dstack guest socket for TEE key operations.
services:
  sidecar:
    image: ghcr.io/attestmesh/cluster-mesh-agent@sha256:e3d53442aa6e52d47227fb3528c1141302ad4fc63c4b3fb6dc38df7ce907d486
    restart: unless-stopped
    environment:
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - SIDECAR_STATE_DIR=/var/lib/attestmesh
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - sidecar-state:/var/lib/attestmesh
    ports:
      - "9090:9090"
      - "51900:51900"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  openkey:
    image: ghcr.io/attestmesh/openkey-api@sha256:4a0fe36f606dd5f2d8357313a9f19828fd2865a5a3aec26d736accea98cd9cd3
    restart: unless-stopped
    depends_on: [postgres-mesh-proxy]
    env_file:
      - /tmp/attestmesh-workload.env
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - openkey-data:/data
    ports:
      - "3001:3001"
    healthcheck:
      test: [CMD, bun, -e, "await fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 18

  postgres-mesh-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on: [sidecar]
    env_file: [/tmp/attestmesh-workload.env]
    entrypoint: [/bin/sh, -ec]
    command:
      - exec socat TCP-LISTEN:15432,fork,reuseaddr,bind=0.0.0.0 TCP:"$$PG_MESH_IP":5432
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  registration-calldata:
    image: ghcr.io/attestmesh/attestmesh-indexer@sha256:14e9e3f6869ada585642c14e4e2e43bee197978ffc68d146dd6d3cddbc49d2bb
    restart: "no"
    entrypoint: ["/usr/local/bin/attestmesh-registration-calldata"]
    environment:
      - CLUSTER=${CLUSTER}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - REGISTRATION_HELPER_ADDR=0.0.0.0:9092
    ports:
      - "9092:9092"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock

volumes:
  sidecar-state:
  openkey-data:
