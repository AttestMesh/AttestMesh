# AttestMesh node + Matrix homeserver — ONE sealed dstack CVM on the self-hosted
# on-chain box (attestmesh.xyz), deployed via the patched mcp__dstack__deploy_app(env=...).
#
# Secrets are injected as dstack encrypted_env (allowed_envs = their KEYS, measured into
# compose_hash; VALUES sealed to the app's X25519 key, decrypted only in the TEE). The
# sealed set passed at deploy time: RPC_URL, BUNDLER_URL, GAS_POLICY_ID, POSTGRES_PASSWORD,
# TS_AUTHKEY  (+ APP_ID auto-injected by the tool if available; else resolved from /Info).
#
# Matrix server_name = <app_id>.gateway.attestmesh.xyz — the app_id is unknown until the
# deploy registers the on-chain app, so `synapse-init` resolves it AT BOOT (from $APP_ID if
# the tool injected it, else by querying the dstack guest socket) and self-writes the config.
#
# Single-node mesh never reaches phase=healthy (no peers to converge with), so Matrix is
# intentionally NOT gated on the sidecar's health — they run independently.

services:

  # ── AttestMesh node sidecar (cluster-mesh-agent): registers this CVM into the cluster ──
  sidecar:
    image: ghcr.io/attestmesh/cluster-mesh-agent:latest
    restart: unless-stopped
    environment:
      - CHAIN_ID=8453
      - INDEXER_REGISTRY_ADDR=0xbC003686943fB957100E517D3CEf66c52B5CDdBf
      - GATEWAY_DOMAIN=gateway.attestmesh.xyz
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - agent-sock:/var/run/attestmesh          # app-facing gRPC UDS, shared with matrix-admin-agent
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  # ── Postgres for Synapse ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=synapse
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 18

  # ── One-shot init: resolve app_id → server_name, generate Synapse config/keys + well-known ──
  # All logic is in Python (no shell $-vars) to sidestep docker-compose ${} interpolation.
  synapse-init:
    image: ghcr.io/element-hq/synapse:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - APP_ID=${APP_ID}
    volumes:
      - synapse-data:/data
      - wellknown:/wellknown
      - agent-secrets:/agent-secrets               # scoped registration-secret drop for matrix-admin-agent
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        cat > /tmp/init.py <<'PYEOF'
        import os, sys, json, socket, subprocess, secrets, time

        DATA = "/data"; WK = "/wellknown"
        hs = os.path.join(DATA, "homeserver.yaml")
        if os.path.exists(hs):
            print("homeserver.yaml exists; init skipped"); sys.exit(0)

        def via_socket(path, method):
            # dstack guest agent speaks prpc over the unix socket; try a few shapes.
            s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM); s.settimeout(5)
            s.connect(path)
            req = "GET /prpc/%s?json HTTP/1.1\r\nHost: dstack\r\nConnection: close\r\n\r\n" % method
            s.sendall(req.encode()); buf = b""
            while True:
                try: chunk = s.recv(4096)
                except Exception: break
                if not chunk: break
                buf += chunk
            s.close()
            body = buf.split(b"\r\n\r\n", 1)[1] if b"\r\n\r\n" in buf else buf
            return json.loads(body.decode("utf-8", "replace"))

        def find_app_id(obj):
            if isinstance(obj, dict):
                for k, v in obj.items():
                    if k.lower() in ("app_id", "appid") and isinstance(v, str) and len(v.replace("0x","")) == 40:
                        return v
                    r = find_app_id(v)
                    if r: return r
            elif isinstance(obj, list):
                for v in obj:
                    r = find_app_id(v)
                    if r: return r
            return None

        appid = (os.environ.get("APP_ID") or "").strip()
        if not appid:
            sock = os.environ.get("DSTACK_SOCKET", "/var/run/dstack.sock")
            for method in ("Info", "GetInfo", "Worker.Info", "Tappd.Info", "Guest.Info"):
                for attempt in range(30):
                    try:
                        appid = find_app_id(via_socket(sock, method)) or ""
                    except Exception:
                        appid = ""
                    if appid: break
                    time.sleep(2)
                if appid: break
        if not appid:
            sys.exit("FATAL: could not resolve app_id (set APP_ID env or check dstack socket)")

        appid = appid.lower().replace("0x", "")
        sn = appid + ".gateway.attestmesh.xyz"
        print("resolved server_name =", sn, flush=True)

        subprocess.run(["python", "-m", "synapse._scripts.generate_signing_key", "-o", os.path.join(DATA, "signing.key")], check=True)
        reg = secrets.token_urlsafe(48); mac = secrets.token_urlsafe(48); form = secrets.token_urlsafe(48)
        pw = os.environ["POSTGRES_PASSWORD"]

        cfg = """server_name: "{sn}"
        pid_file: /data/homeserver.pid
        signing_key_path: /data/signing.key
        media_store_path: /data/media_store
        report_stats: false
        public_baseurl: "https://homeserver.invalid/"
        listeners:
          - port: 8008
            tls: false
            type: http
            x_forwarded: true
            bind_addresses: ['0.0.0.0']
            resources:
              - names: [client, federation]
                compress: false
        database:
          name: psycopg2
          args:
            user: synapse
            password: "{pw}"
            database: synapse
            host: postgres
            cp_min: 5
            cp_max: 10
        registration_shared_secret: "{reg}"
        macaroon_secret_key: "{mac}"
        form_secret: "{form}"
        enable_registration: false
        url_preview_enabled: false
        suppress_key_server_warning: true
        trusted_key_servers:
          - server_name: "matrix.org"
        """.replace("\n        ", "\n").format(sn=sn, pw=pw, reg=reg, mac=mac, form=form)
        with open(hs, "w") as f: f.write(cfg)

        # Scoped copy of just the registration shared secret for the matrix-admin-agent,
        # so it never needs the whole synapse-data volume (signing key, media, etc.).
        # The agent-secrets volume is mounted ONLY into synapse-init (here) and the agent.
        try:
            os.makedirs("/agent-secrets", exist_ok=True)
            ap = "/agent-secrets/registration_shared_secret"
            with open(ap, "w") as f: f.write(reg)
            os.chmod(ap, 0o444)
            print("synapse-init: wrote scoped registration secret for matrix-admin-agent", flush=True)
        except Exception as e:
            print("synapse-init: WARN could not write agent-secrets:", e, flush=True)

        # PRIVATE node (tailnet-only, gateway-off, non-federating). public_baseurl is the sentinel
        # host `homeserver.invalid` ON PURPOSE: Synapse echoes public_baseurl back in the LOGIN
        # response's m.homeserver well_known, and a Matrix client then SWITCHES its base_url to
        # whatever that says. The real tailnet URL changes every fresh-disk roll, so we can't bake
        # it in here — instead nginx rewrites `homeserver.invalid` → the client's own Host ($host)
        # on the way out (see the nginx sub_filter), so the login well_known always sends the client
        # back to the exact tailnet URL it used — never the dead gateway domain. (No static
        # well-known files are written; nginx serves the client well-known dynamically. No
        # federation → no server well-known.)

        # Synapse runs as uid 991 in this image.
        for root, dirs, files in os.walk(DATA):
            for n in dirs + files:
                try: os.chown(os.path.join(root, n), 991, 991)
                except Exception: pass
        try: os.chown(DATA, 991, 991)
        except Exception: pass
        print("synapse-init: config + signing key + well-known written", flush=True)
        PYEOF
        python3 /tmp/init.py

  # ── Synapse homeserver ──────────────────────────────────────────────────────
  synapse:
    image: ghcr.io/element-hq/synapse:latest
    restart: unless-stopped
    depends_on:
      synapse-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    volumes:
      - synapse-data:/data

  # ── Matrix admin agent: executes the full Synapse admin surface from (a) on-chain member
  #     commands delivered by the sidecar app gRPC (deterministic, no LLM) and (b) an LLM bot
  #     in Matrix for allowlisted operators. Egress is locked by agent-egress-fw (below) to
  #     Synapse + Postgres + the one pinned LLM host. See docs/specs/matrix-admin-agent.md. ──
  matrix-admin-agent:
    image: ghcr.io/attestmesh/matrix-admin-agent:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
      sidecar:
        condition: service_started
    environment:
      - SYNAPSE_URL=http://synapse:8008
      - MATRIX_HOMESERVER_URL=http://nginx:80
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      - REG_SECRET_PATH=/agent-secrets/registration_shared_secret
      - PG_DSN=postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse
      - BOT_USERNAME=${BOT_USERNAME}
      - BOT_PASSWORD=${BOT_PASSWORD}
      - MATRIX_ADMIN_MXIDS=${MATRIX_ADMIN_MXIDS}
      - MATRIX_ADMIN_SENDERS=${MATRIX_ADMIN_SENDERS}
      - INITIAL_ADMIN=${INITIAL_ADMIN}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - HEALTH_HTTP_ADDR=0.0.0.0:9100
      - LOG_LEVEL=info
    volumes:
      - agent-sock:/var/run/attestmesh                 # sidecar app-facing gRPC UDS
      - agent-secrets:/agent-secrets:ro                # scoped registration secret only

  # ── Egress firewall for the agent: shares the agent's netns and sets default-DROP OUTPUT,
  #     allowing ONLY loopback, established/related, Docker DNS, the compose bridge (Synapse +
  #     Postgres), and the single pinned LLM host:443. Network-enforced exfiltration control —
  #     the agent has no self-egress tool, and even a jailbroken LLM cannot reach the internet.
  #     Logic lives in the image (auditable), not inline compose shell. ──
  agent-egress-fw:
    image: ghcr.io/attestmesh/agent-egress-fw:latest
    restart: unless-stopped
    network_mode: service:matrix-admin-agent
    depends_on:
      - matrix-admin-agent
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}                   # the ONE permitted external host (:443)
      - LLM_ALLOW_CIDRS=66.220.6.0/24                  # redpill api.redpill.ai block — guaranteed LLM reachability (resolution-independent)
      - INTERNAL_HOSTS=synapse postgres nginx          # internal services the agent may reach (by resolved IP)
      - ALLOW_DNS=127.0.0.11                           # Docker embedded resolver
      - RERESOLVE_SECONDS=15                            # re-resolve pinned + internal hosts (DNS pinning)
    cap_add:
      - NET_ADMIN

  # ── Reverse proxy: well-known delegation + /_matrix|/_synapse → synapse ──────
  # config written at runtime (avoids needing a build context / BuildKit heredoc).
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - wellknown:/usr/share/nginx/wellknown:ro
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 80 default_server;
          server_name _;
          client_max_body_size 50M;

          # Private node: serve a self-referential client well-known WITH CORS — and crucially
          # `add_header ... always` so the header is present on every response, not just 2xx. A bare
          # 404 here has no CORS header, so Element's browser-side discovery fetch is CORS-blocked
          # and it reports "not a valid homeserver". base_url reflects the Host the client used
          # ($host, preserved by tailscale serve) so it tracks the MagicDNS name across rolls.
          # (No federation → no server well-known.)
          location = /.well-known/matrix/client {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            return 200 '{"m.homeserver": {"base_url": "https://$$host"}}';
          }

          location ~ ^(/_matrix|/_synapse/client) {
            proxy_pass http://synapse:8008;
            proxy_set_header X-Forwarded-For $$remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $$host;
            proxy_set_header Accept-Encoding "";
            proxy_http_version 1.1;
            # Rewrite Synapse's public_baseurl sentinel to the client's own Host on the way out, so
            # the LOGIN response's m.homeserver well_known sends the client back to the tailnet URL it
            # actually used (the real name churns each fresh-disk roll) instead of the dead gateway
            # domain. Requires the upstream response uncompressed (Accept-Encoding "" above); Synapse's
            # client listener already sets compress:false. $host is preserved through tailscale serve.
            sub_filter 'homeserver.invalid' '$$host';
            sub_filter_once off;
            sub_filter_types application/json;
          }

          # agent /healthz over the tailnet (bridge-mode verify-agent; no host port-maps). Health only.
          location = /_agent/healthz {
            proxy_pass http://matrix-admin-agent:9100/healthz;
            proxy_set_header Host $$host;
          }

          location = / {
            default_type text/plain;
            return 200 "AttestMesh Matrix node — Synapse homeserver. Use a Matrix client against this domain.\n";
          }
        }
        NGINX
        exec nginx -g 'daemon off;'

  # ── Tailscale serve config writer: drops the TS_SERVE_CONFIG the tailscale container consumes
  #     (HTTPS-terminate on the tailnet :443 → local nginx:80). $${TS_CERT_DOMAIN} is substituted by
  #     containerboot with this node's MagicDNS name, so it tracks the actual hostname even though
  #     that changes on each fresh-disk roll. ($$ escapes the literal $ past compose interpolation.) ──
  ts-serve-init:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ts-config:/cfg
    command:
      - /bin/sh
      - -c
      - |
        cat > /cfg/serve.json <<'JSON'
        {"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:80"}}}}}
        JSON
        echo "ts-serve-init: wrote /cfg/serve.json"

  # ── Tailscale: joins the tailnet sharing nginx's netns. Matrix is reachable over the tailnet at
  #     https://<magicdns-name>/ — `tailscale serve` (TS_SERVE_CONFIG) terminates TLS on :443 and
  #     proxies to nginx:80; the cert is auto-provisioned by the tailnet's HTTPS feature. ──
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    network_mode: service:nginx
    depends_on:
      ts-serve-init:
        condition: service_completed_successfully
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=matrix-attestmesh
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--netfilter-mode=off
      - TS_SERVE_CONFIG=/cfg/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ts-config:/cfg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun

  # ── Tailnet firewall: only Matrix (nginx:80) is reachable over the tailscale interface.
  #     Shares nginx's netns (where tailscale0 lives). Tailscale runs --netfilter-mode=off so
  #     these rules are authoritative. Re-applied every 30s (idempotent) to survive churn. ──
  ts-firewall:
    image: alpine:3.20
    restart: unless-stopped
    network_mode: service:nginx
    depends_on:
      - tailscale
    cap_add:
      - NET_ADMIN
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache iptables >/dev/null 2>&1 || apk add --no-cache iptables >/dev/null 2>&1
        while ! [ -d /sys/class/net/tailscale0 ]; do sleep 2; done
        while true; do
          iptables -C INPUT -i tailscale0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT 2>/dev/null || iptables -A INPUT -i tailscale0 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          iptables -C INPUT -i tailscale0 -p tcp --dport 80 -j ACCEPT 2>/dev/null || iptables -A INPUT -i tailscale0 -p tcp --dport 80 -j ACCEPT
          iptables -C INPUT -i tailscale0 -p tcp --dport 443 -j ACCEPT 2>/dev/null || iptables -A INPUT -i tailscale0 -p tcp --dport 443 -j ACCEPT
          iptables -C INPUT -i tailscale0 -p icmp -j ACCEPT 2>/dev/null || iptables -A INPUT -i tailscale0 -p icmp -j ACCEPT
          iptables -C INPUT -i tailscale0 -j DROP 2>/dev/null || iptables -A INPUT -i tailscale0 -j DROP
          iptables -C FORWARD -i tailscale0 -j DROP 2>/dev/null || iptables -A FORWARD -i tailscale0 -j DROP
          sleep 30
        done

volumes:
  pgdata:
  synapse-data:
  wellknown:
  tailscale-state:
  ts-config:         # tailscale serve config (TS_SERVE_CONFIG → HTTPS on the tailnet)
  agent-sock:        # sidecar app-facing gRPC UDS, shared sidecar ↔ matrix-admin-agent
  agent-secrets:     # scoped registration-secret drop, synapse-init → matrix-admin-agent
