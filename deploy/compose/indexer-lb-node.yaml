# Stable public front door for AttestMesh Indexer blue/green cutovers and
# Stage A shared-identity worker pools.
#
# The LB is itself a C3 member. HAProxy exposes the stable gateway ports:
#   :50052  gRPC Subscribe stream (TCP/h2c to the active Indexer)
#   :9090   Indexer HTTP health/status/read model
# Its authenticated control API binds only to the mesh interface on :50053.
#
# A switch is deliberately two-phase. `prepare` probes the candidate or every
# member of a shared-identity worker pool, then stops accepting new frontend
# connections while existing gRPC streams continue. The deploy driver then
# updates IndexerRegistry with the candidate/pool signing key
# and calls `commit`, which changes both HAProxy backends, closes old streams, and
# re-enables the frontends. Sidecars reconnect through the stable endpoint.

services:
  sidecar:
    image: ghcr.io/attestmesh/cluster-mesh-agent@sha256:e3d53442aa6e52d47227fb3528c1141302ad4fc63c4b3fb6dc38df7ce907d486
    restart: unless-stopped
    environment:
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - SIDECAR_STATE_DIR=/var/lib/attestmesh
      - AGENT_GRPC_SOCKET=/var/run/attestmesh/agent.sock
      # :9090 belongs to the proxied Indexer HTTP frontend.
      - HEALTH_HTTP_ADDR=0.0.0.0:9091
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - sidecar-state:/var/lib/attestmesh
      - agent-sock:/var/run/attestmesh
    ports:
      - "51900:51900"
      - "50051:50051"
      - "50052:50052"
      - "50053:50053"
      - "9090:9090"
      - "9091:9091"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

  registration-calldata:
    image: ghcr.io/attestmesh/cluster-mesh-agent@sha256:e3d53442aa6e52d47227fb3528c1141302ad4fc63c4b3fb6dc38df7ce907d486
    restart: "no"
    depends_on:
      - sidecar
    entrypoint: ["/usr/local/bin/attestmesh-registration-calldata"]
    environment:
      - CLUSTER=${CLUSTER}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - REGISTRATION_HELPER_ADDR=0.0.0.0:9092
    ports:
      - "9092:9092"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock

  haproxy:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    user: "0:0"
    network_mode: service:sidecar
    depends_on:
      - sidecar
    environment:
      - APP_ENV_B64=${APP_ENV_B64}
    volumes:
      - haproxy-run:/indexer-lb-run
      - indexer-lb-state:/indexer-lb-state
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -u
        printf '%s' "$${APP_ENV_B64:-}" | base64 -d > /tmp/indexer-lb.env
        set -a
        . /tmp/indexer-lb.env
        set +a
        mkdir -p /indexer-lb-run /indexer-lb-state
        rm -f /indexer-lb-run/admin.sock
        cat >/tmp/indexer-lb-haproxy.cfg <<CFG
        global
          maxconn 4096
          stats socket /indexer-lb-run/admin.sock mode 660 level admin expose-fd listeners
          stats timeout 30s

        defaults
          mode tcp
          timeout connect 10s
          timeout client 1h
          timeout server 1h
          timeout check 10s

        frontend indexer_grpc
          mode tcp
          bind 0.0.0.0:50052
          default_backend indexer_grpc_active

        backend indexer_grpc_active
          mode tcp
          balance roundrobin
          option tcp-check
          default-server inter 3s fall 2 rise 2 on-marked-down shutdown-sessions
          server-template worker 1-8 127.0.0.1:1 check disabled

        frontend indexer_http
          mode http
          bind 0.0.0.0:9090
          option http-keep-alive
          default_backend indexer_http_active

        backend indexer_http_active
          mode http
          balance roundrobin
          option httpchk GET /healthz
          http-check expect status 200
          default-server inter 3s fall 2 rise 2 on-marked-down shutdown-sessions
          server-template worker 1-8 127.0.0.1:1 check disabled
        CFG
        exec haproxy -f /tmp/indexer-lb-haproxy.cfg -db

  controller:
    image: python:3.11-alpine
    restart: unless-stopped
    network_mode: service:sidecar
    depends_on:
      - sidecar
      - haproxy
    environment:
      - APP_ENV_B64=${APP_ENV_B64}
    volumes:
      - haproxy-run:/indexer-lb-run
      - indexer-lb-state:/indexer-lb-state
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '%s' "$${APP_ENV_B64:-}" | base64 -d > /tmp/indexer-lb.env
        set -a
        . /tmp/indexer-lb.env
        set +a
        cat >/tmp/indexer_lb_controller.py <<'PY'
        import fcntl
        import hmac
        import ipaddress
        import json
        import os
        import re
        import socket
        import struct
        import time
        import urllib.request
        from concurrent.futures import ThreadPoolExecutor
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        ADMIN_KEY = os.environ.get("INDEXER_LB_ADMIN_KEY", "")
        INITIAL_BACKENDS = os.environ.get("INDEXER_LB_INITIAL_BACKEND", "")
        LB_CLUSTER = os.environ.get("INDEXER_LB_CLUSTER", "").strip().lower()
        PINNED_SHARED_PUBKEY = os.environ.get(
            "INDEXER_LB_PINNED_PUBKEY", ""
        ).strip().lower()
        SOCKET_PATH = "/indexer-lb-run/admin.sock"
        ACTIVE_BACKEND_PATH = "/indexer-lb-state/active_backend"
        ACTIVE_PUBKEY_PATH = "/indexer-lb-state/active_pubkey"
        ACTIVE_CODE_ID_PATH = "/indexer-lb-state/active_code_id"
        ACTIVE_CLUSTER_PATH = "/indexer-lb-state/active_cluster"
        ACTIVE_MEMBERS_PATH = "/indexer-lb-state/active_members"
        PREPARED_PATH = "/indexer-lb-state/prepared.json"
        HEX32_RE = re.compile(r"^0x[0-9a-fA-F]{64}$")
        ADDRESS_RE = re.compile(r"^0x[0-9a-fA-F]{40}$")
        ZERO32 = "0x" + ("0" * 64)
        ZERO_ADDRESS = "0x" + ("0" * 40)
        MAX_BACKENDS = 8
        MAX_HEAD_LAG_BLOCKS = 10
        SERVING_WAIT_SECONDS = 90

        if not ADMIN_KEY:
            raise SystemExit("INDEXER_LB_ADMIN_KEY is required")
        if not ADDRESS_RE.fullmatch(LB_CLUSTER) or LB_CLUSTER == ZERO_ADDRESS:
            raise SystemExit("INDEXER_LB_CLUSTER must be a nonzero 20-byte address")

        def mesh_ip() -> str:
            while True:
                sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                try:
                    packed = struct.pack("256s", b"attestmesh0"[:15])
                    return socket.inet_ntoa(
                        fcntl.ioctl(sock.fileno(), 0x8915, packed)[20:24]
                    )
                except OSError:
                    time.sleep(1)
                finally:
                    sock.close()

        def read_text(path: str) -> str:
            try:
                with open(path, "r", encoding="utf-8") as fh:
                    return fh.read().strip()
            except FileNotFoundError:
                return ""

        def write_text(path: str, value: str) -> None:
            tmp = path + ".tmp"
            with open(tmp, "w", encoding="utf-8") as fh:
                fh.write(value + "\n")
            os.replace(tmp, path)

        def read_prepared() -> dict:
            try:
                with open(PREPARED_PATH, "r", encoding="utf-8") as fh:
                    value = json.load(fh)
                    return value if isinstance(value, dict) else {}
            except (FileNotFoundError, ValueError):
                return {}

        def write_prepared(value: dict) -> None:
            tmp = PREPARED_PATH + ".tmp"
            with open(tmp, "w", encoding="utf-8") as fh:
                json.dump(value, fh, sort_keys=True)
            os.replace(tmp, PREPARED_PATH)

        def clear_prepared() -> None:
            try:
                os.unlink(PREPARED_PATH)
            except FileNotFoundError:
                pass

        def haproxy_cmd(command: str) -> str:
            sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
            sock.settimeout(10)
            sock.connect(SOCKET_PATH)
            sock.sendall((command.rstrip() + "\n").encode("utf-8"))
            sock.shutdown(socket.SHUT_WR)
            chunks = []
            while True:
                chunk = sock.recv(4096)
                if not chunk:
                    break
                chunks.append(chunk)
            sock.close()
            output = b"".join(chunks).decode("utf-8", errors="replace")
            if output.lstrip().startswith("Unknown command"):
                raise RuntimeError(output.strip())
            return output

        def validate_backend(value: str) -> str:
            try:
                ip = ipaddress.IPv4Address(value)
            except Exception as exc:
                raise ValueError("backend must be an IPv4 address") from exc
            if not ip.is_private:
                raise ValueError("backend must be a private bridge or mesh address")
            return str(ip)

        def validate_backends(value, *, allow_empty: bool = False) -> list[str]:
            if isinstance(value, str):
                raw = [part.strip() for part in value.split(",") if part.strip()]
            elif isinstance(value, list):
                raw = [str(part).strip() for part in value]
            else:
                raise ValueError("backends must be an array or comma-separated string")
            if not raw and not allow_empty:
                raise ValueError("at least one backend is required")
            if len(raw) > MAX_BACKENDS:
                raise ValueError(f"at most {MAX_BACKENDS} backends are supported")
            out = [validate_backend(part) for part in raw]
            if len(set(out)) != len(out):
                raise ValueError("backend addresses must be distinct")
            return out

        def normalize_hex32(value: str, field: str, *, nonzero: bool = False) -> str:
            value = value.strip().lower()
            if not HEX32_RE.fullmatch(value):
                raise ValueError(f"{field} must be a 32-byte 0x hex value")
            if nonzero and value == ZERO32:
                raise ValueError(f"{field} must be nonzero")
            return value

        def normalize_pubkey(value: str) -> str:
            return normalize_hex32(value, "expected_pubkey", nonzero=True)

        def normalize_address(value: str, field: str) -> str:
            value = value.strip().lower()
            if not ADDRESS_RE.fullmatch(value) or value == ZERO_ADDRESS:
                raise ValueError(f"{field} must be a nonzero 20-byte 0x address")
            return value

        def read_active_backends() -> list[str]:
            return validate_backends(read_text(ACTIVE_BACKEND_PATH), allow_empty=True)

        def probe_backend(
            ip: str,
            expected_pubkey: str,
            *,
            shared_ha: bool,
            expected_code_id: str = "",
            expected_cluster: str = "",
            expected_member: str = "",
            require_serving: bool,
        ) -> dict:
            health_body = ""
            if require_serving or not shared_ha:
                with socket.create_connection((ip, 50052), timeout=10):
                    pass
                with urllib.request.urlopen(f"http://{ip}:9090/healthz", timeout=10) as resp:
                    health_body = resp.read(2048).decode("utf-8", errors="replace")
                    if resp.status != 200:
                        raise RuntimeError(
                            f"health probe returned HTTP {resp.status}: {health_body[:200]}"
                        )
            with urllib.request.urlopen(f"http://{ip}:9090/status", timeout=10) as resp:
                status = json.load(resp)
            actual_pubkey = normalize_pubkey(str(status.get("pubKey", "")))
            if actual_pubkey != expected_pubkey:
                raise RuntimeError(
                    f"backend pubkey mismatch: expected {expected_pubkey}, got {actual_pubkey}"
                )
            health = status.get("health") or {}
            if shared_ha:
                actual_code_id = normalize_hex32(
                    str(status.get("codeId", "")), "status.codeId", nonzero=True
                )
                actual_cluster = normalize_address(
                    str(status.get("indexerCluster", "")), "status.indexerCluster"
                )
                actual_member = normalize_hex32(
                    str(status.get("servingMemberId", "")),
                    "status.servingMemberId",
                    nonzero=True,
                )
                if status.get("identityMode") != "cluster-shared":
                    raise RuntimeError("backend identityMode is not cluster-shared")
                if actual_code_id != expected_code_id:
                    raise RuntimeError(
                        f"backend codeId mismatch: expected {expected_code_id}, got {actual_code_id}"
                    )
                if actual_cluster != expected_cluster:
                    raise RuntimeError(
                        f"backend indexerCluster mismatch: expected {expected_cluster}, got {actual_cluster}"
                    )
                if expected_member and actual_member != expected_member:
                    raise RuntimeError(
                        f"backend servingMemberId changed: expected {expected_member}, got {actual_member}"
                    )
                lag = health.get("chainHeadLagBlocks")
                if health.get("rpcReachable") is not True:
                    raise RuntimeError(f"backend RPC is not reachable: {health}")
                if type(lag) is not int or lag < 0 or lag >= MAX_HEAD_LAG_BLOCKS:
                    raise RuntimeError(f"backend chain head lag is not acceptable: {health}")
                read_model = status.get("readModel") or {}
                if type(read_model.get("atBlock")) is not int:
                    raise RuntimeError(f"backend read model is not caught up: {read_model}")
                if type(read_model.get("clusterCount")) is not int or read_model["clusterCount"] < 1:
                    raise RuntimeError(f"backend read model is empty: {read_model}")
                if require_serving and (
                    health.get("grpcAccepting") is not True or health.get("ok") is not True
                ):
                    raise RuntimeError(f"backend is not serving after registry update: {health}")
            else:
                actual_code_id = ""
                actual_cluster = ""
                actual_member = ""
                if health.get("ok") is not True:
                    raise RuntimeError(f"backend status is unhealthy: {health}")
            return {
                "health": health_body[:500],
                "pubkey": actual_pubkey,
                "code_id": actual_code_id,
                "cluster": actual_cluster,
                "member_id": actual_member,
                "status": status,
            }

        def probe_pool(
            backends: list[str],
            pubkey: str,
            *,
            shared_ha: bool,
            code_id: str = "",
            cluster: str = "",
            expected_members: list[str] | None = None,
            require_serving: bool,
        ) -> list[dict]:
            expected_members = expected_members or ([""] * len(backends))
            if len(expected_members) != len(backends):
                raise ValueError("expected member IDs must match the backend count")
            if shared_ha and require_serving and not all(expected_members):
                raise ValueError("serving commit requires every prepared member ID")
            with ThreadPoolExecutor(max_workers=len(backends)) as executor:
                futures = [
                    executor.submit(
                        probe_backend,
                        backend,
                        pubkey,
                        shared_ha=shared_ha,
                        expected_code_id=code_id,
                        expected_cluster=cluster,
                        expected_member=expected_members[index],
                        require_serving=require_serving,
                    )
                    for index, backend in enumerate(backends)
                ]
                probes = [future.result() for future in futures]
            if shared_ha:
                members = [probe["member_id"] for probe in probes]
                if len(set(members)) != len(members):
                    raise RuntimeError("shared HA backends must have distinct servingMemberIds")
            return probes

        def probe_initial_shared_pool(backends: list[str]) -> dict:
            # Initial pool recovery is allowed only when the registry already lets
            # the workers serve. A first migration must go through prepare/commit.
            with urllib.request.urlopen(
                f"http://{backends[0]}:9090/status", timeout=10
            ) as resp:
                first = json.load(resp)
            if not PINNED_SHARED_PUBKEY:
                raise RuntimeError(
                    "initial shared pool requires an independently pinned pubkey"
                )
            pubkey = normalize_pubkey(PINNED_SHARED_PUBKEY)
            code_id = normalize_hex32(
                str(first.get("codeId", "")), "status.codeId", nonzero=True
            )
            cluster = normalize_address(
                str(first.get("indexerCluster", "")), "status.indexerCluster"
            )
            if cluster == LB_CLUSTER:
                raise RuntimeError(
                    "initial shared pool uses the LB/C3 cluster instead of a dedicated cluster"
                )
            discovered = probe_pool(
                backends,
                pubkey,
                shared_ha=True,
                code_id=code_id,
                cluster=cluster,
                require_serving=False,
            )
            members = [probe["member_id"] for probe in discovered]
            probe_pool(
                backends,
                pubkey,
                shared_ha=True,
                code_id=code_id,
                cluster=cluster,
                expected_members=members,
                require_serving=True,
            )
            return {
                "pubkey": pubkey,
                "code_id": code_id,
                "cluster": cluster,
                "members": members,
            }

        def wait_until_serving(prepared: dict) -> list[dict]:
            deadline = time.monotonic() + SERVING_WAIT_SECONDS
            last_error = None
            while time.monotonic() < deadline:
                try:
                    return probe_pool(
                        prepared["backends"],
                        prepared["pubkey"],
                        shared_ha=prepared.get("shared_ha", False),
                        code_id=prepared.get("code_id", ""),
                        cluster=prepared.get("cluster", ""),
                        expected_members=prepared.get("members", []),
                        require_serving=True,
                    )
                except Exception as exc:
                    last_error = exc
                    time.sleep(3)
            raise RuntimeError(
                f"backends did not become serving within {SERVING_WAIT_SECONDS}s: {last_error}"
            )

        def frontends(enabled: bool) -> None:
            verb = "enable" if enabled else "disable"
            haproxy_cmd(f"{verb} frontend indexer_grpc")
            haproxy_cmd(f"{verb} frontend indexer_http")

        def set_pool(backends: list[str]) -> dict:
            outputs = {"backends": list(backends), "slots": []}
            for index in range(1, MAX_BACKENDS + 1):
                name = f"worker{index}"
                if index <= len(backends):
                    ip = backends[index - 1]
                    haproxy_cmd(
                        f"set server indexer_grpc_active/{name} addr {ip} port 50052"
                    )
                    haproxy_cmd(
                        f"set server indexer_http_active/{name} addr {ip} port 9090"
                    )
                    haproxy_cmd(f"enable server indexer_grpc_active/{name}")
                    haproxy_cmd(f"enable server indexer_http_active/{name}")
                    outputs["slots"].append({"slot": name, "backend": ip, "enabled": True})
                else:
                    haproxy_cmd(f"disable server indexer_grpc_active/{name}")
                    haproxy_cmd(f"disable server indexer_http_active/{name}")
                    outputs["slots"].append({"slot": name, "enabled": False})
            return outputs

        def close_sessions() -> dict:
            outputs = {}
            for index in range(1, MAX_BACKENDS + 1):
                name = f"worker{index}"
                outputs[name] = {
                    "grpc": haproxy_cmd(
                        f"shutdown sessions server indexer_grpc_active/{name}"
                    ),
                    "http": haproxy_cmd(
                        f"shutdown sessions server indexer_http_active/{name}"
                    ),
                }
            return outputs

        def persist_active(
            backends: list[str],
            pubkey: str,
            *,
            code_id: str = "",
            cluster: str = "",
            members: list[str] | None = None,
        ) -> None:
            write_text(ACTIVE_BACKEND_PATH, ",".join(backends))
            write_text(ACTIVE_PUBKEY_PATH, pubkey)
            write_text(ACTIVE_CODE_ID_PATH, code_id)
            write_text(ACTIVE_CLUSTER_PATH, cluster)
            write_text(ACTIVE_MEMBERS_PATH, ",".join(members or []))

        def active_state() -> dict:
            return {
                "backends": read_active_backends(),
                "pubkey": read_text(ACTIVE_PUBKEY_PATH),
                "code_id": read_text(ACTIVE_CODE_ID_PATH),
                "cluster": read_text(ACTIVE_CLUSTER_PATH),
                "members": [
                    member
                    for member in read_text(ACTIVE_MEMBERS_PATH).split(",")
                    if member
                ],
            }

        def restore_state(state: dict, *, close_existing: bool) -> dict:
            backends = validate_backends(state.get("backends", []), allow_empty=True)
            changed = set_pool(backends)
            sessions = close_sessions() if close_existing else {}
            persist_active(
                backends,
                str(state.get("pubkey", "")),
                code_id=str(state.get("code_id", "")),
                cluster=str(state.get("cluster", "")),
                members=list(state.get("members", [])),
            )
            return {"haproxy": changed, "closed_sessions": sessions}

        def prepare_from_body(body: dict) -> tuple[dict, list[dict]]:
            pubkey = normalize_pubkey(str(body.get("expected_pubkey", "")))
            if "backends" not in body:
                # Backward-compatible single-backend blue/green request.
                backends = [validate_backend(str(body.get("backend", "")).strip())]
                raw_code_id = str(body.get("expected_code_id", "")).strip()
                code_id = (
                    normalize_hex32(raw_code_id, "expected_code_id")
                    if raw_code_id
                    else ""
                )
                probes = probe_pool(
                    backends,
                    pubkey,
                    shared_ha=False,
                    require_serving=True,
                )
                return (
                    {
                        "backend": backends[0],
                        "backends": backends,
                        "pubkey": pubkey,
                        "code_id": code_id,
                        "shared_ha": False,
                        "prepared_at": int(time.time()),
                    },
                    probes,
                )

            backends = validate_backends(body.get("backends"))
            if len(backends) < 2:
                raise ValueError("a shared HA pool requires at least two backends")
            code_id = normalize_hex32(
                str(body.get("expected_code_id", "")), "expected_code_id", nonzero=True
            )
            cluster = normalize_address(
                str(body.get("expected_cluster", "")), "expected_cluster"
            )
            if cluster == LB_CLUSTER:
                raise ValueError(
                    "shared HA pool must use a dedicated cluster, not the LB/C3 cluster"
                )
            probes = probe_pool(
                backends,
                pubkey,
                shared_ha=True,
                code_id=code_id,
                cluster=cluster,
                require_serving=False,
            )
            members = [probe["member_id"] for probe in probes]
            return (
                {
                    "backend": backends[0],
                    "backends": backends,
                    "pubkey": pubkey,
                    "code_id": code_id,
                    "cluster": cluster,
                    "members": members,
                    "shared_ha": True,
                    "prepared_at": int(time.time()),
                },
                probes,
            )

        def restore_from_body(body: dict) -> dict:
            backends = validate_backends(body.get("backends", []), allow_empty=True)
            raw_pubkey = str(body.get("active_pubkey", "")).strip()
            pubkey = normalize_pubkey(raw_pubkey) if raw_pubkey else ""
            raw_code_id = str(body.get("active_code_id", "")).strip()
            code_id = (
                normalize_hex32(raw_code_id, "active_code_id", nonzero=True)
                if raw_code_id
                else ""
            )
            raw_cluster = str(body.get("active_cluster", "")).strip()
            cluster = normalize_address(raw_cluster, "active_cluster") if raw_cluster else ""
            members = body.get("active_members", [])
            if not isinstance(members, list):
                raise ValueError("active_members must be an array")
            normalized_members = [
                normalize_hex32(str(member), "active_members[]", nonzero=True)
                for member in members
            ]
            if normalized_members and len(normalized_members) != len(backends):
                raise ValueError("active_members length must match backends")
            frontends(False)
            restored = restore_state(
                {
                    "backends": backends,
                    "pubkey": pubkey,
                    "code_id": code_id,
                    "cluster": cluster,
                    "members": normalized_members,
                },
                close_existing=True,
            )
            clear_prepared()
            frontends(True)
            return {"restored": True, **restored}

        class Handler(BaseHTTPRequestHandler):
            def _json(self, status: int, payload: dict) -> None:
                data = json.dumps(payload, sort_keys=True).encode("utf-8")
                self.send_response(status)
                self.send_header("content-type", "application/json")
                self.send_header("content-length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)

            def _authorized(self) -> bool:
                supplied = self.headers.get("authorization", "")
                return hmac.compare_digest(supplied, f"Bearer {ADMIN_KEY}")

            def _body(self) -> dict:
                length = min(int(self.headers.get("content-length", "0") or 0), 16384)
                value = json.loads(self.rfile.read(length).decode("utf-8") or "{}")
                if not isinstance(value, dict):
                    raise ValueError("request body must be a JSON object")
                return value

            def do_GET(self) -> None:
                if self.path not in ("/healthz", "/active"):
                    self._json(404, {"error": "not found"})
                    return
                socket_ok = os.path.exists(SOCKET_PATH)
                state = ""
                if socket_ok:
                    try:
                        state = haproxy_cmd("show servers state")[:8000]
                    except Exception as exc:
                        state = f"error: {type(exc).__name__}: {exc}"
                self._json(
                    200,
                    {
                        "active_backend": read_text(ACTIVE_BACKEND_PATH),
                        "active_backends": read_active_backends(),
                        "active_pubkey": read_text(ACTIVE_PUBKEY_PATH),
                        "active_code_id": read_text(ACTIVE_CODE_ID_PATH),
                        "active_cluster": read_text(ACTIVE_CLUSTER_PATH),
                        "active_members": [
                            member
                            for member in read_text(ACTIVE_MEMBERS_PATH).split(",")
                            if member
                        ],
                        "prepared": read_prepared(),
                        "haproxy_socket": socket_ok,
                        "haproxy_state": state,
                    },
                )

            def do_POST(self) -> None:
                if self.path not in ("/prepare", "/commit", "/abort", "/restore"):
                    self._json(404, {"error": "not found"})
                    return
                if not self._authorized():
                    self._json(401, {"error": "unauthorized"})
                    return
                try:
                    if self.path == "/prepare":
                        prepared, probes = prepare_from_body(self._body())
                        # This is the rollback journal for an interrupted commit.
                        # It is cleared only after the new pool is fully persisted.
                        prepared["previous"] = active_state()
                        prepared["commit_started"] = False
                        write_prepared(prepared)
                        try:
                            frontends(False)
                        except Exception:
                            clear_prepared()
                            frontends(True)
                            raise
                        self._json(200, {"prepared": prepared, "probes": probes})
                        return

                    if self.path == "/abort":
                        prepared = read_prepared()
                        previous = prepared.get("previous") if prepared else None
                        if isinstance(previous, dict):
                            restore_state(
                                previous,
                                close_existing=prepared.get("commit_started") is True,
                            )
                        else:
                            set_pool(read_active_backends())
                        clear_prepared()
                        frontends(True)
                        self._json(
                            200,
                            {"aborted": True, "active_backend": read_text(ACTIVE_BACKEND_PATH)},
                        )
                        return

                    if self.path == "/restore":
                        restored = restore_from_body(self._body())
                        self._json(
                            200,
                            {
                                **restored,
                                "active_backend": read_text(ACTIVE_BACKEND_PATH),
                                "active_backends": read_active_backends(),
                            },
                        )
                        return

                    prepared = read_prepared()
                    if not prepared:
                        self._json(409, {"error": "no prepared backend or pool"})
                        return
                    backends = validate_backends(prepared.get("backends", []))
                    pubkey = normalize_pubkey(str(prepared.get("pubkey", "")))
                    previous = prepared.get("previous")
                    if not isinstance(previous, dict):
                        previous = active_state()
                    prepared["commit_started"] = True
                    write_prepared(prepared)
                    # Re-probe after the on-chain registry transaction, immediately
                    # before changing the data plane. Shared candidates may have been
                    # intentionally non-serving until that transaction, so wait for
                    # every member of the pool to open gRPC.
                    probes = wait_until_serving(prepared)
                    try:
                        changed = set_pool(backends)
                        sessions = close_sessions()
                        persist_active(
                            backends,
                            pubkey,
                            code_id=prepared.get("code_id", ""),
                            cluster=prepared.get("cluster", ""),
                            members=prepared.get("members", []),
                        )
                        clear_prepared()
                        frontends(True)
                    except Exception:
                        # A partially applied runtime-slot update must not leak a
                        # candidate connection after we reopen the old pool.
                        restore_state(previous, close_existing=True)
                        frontends(True)
                        raise
                    self._json(
                        200,
                        {
                            "active_backend": ",".join(backends),
                            "active_backends": backends,
                            "active_pubkey": pubkey,
                            "previous_backend": ",".join(previous.get("backends", [])),
                            "previous_backends": previous.get("backends", []),
                            "probes": probes,
                            "haproxy": changed,
                            "closed_sessions": sessions,
                        },
                    )
                except Exception as exc:
                    self._json(400, {"error": f"{type(exc).__name__}: {exc}"})

            def log_message(self, fmt: str, *args) -> None:
                print(
                    f"indexer-lb-controller: {self.address_string()} {fmt % args}",
                    flush=True,
                )

        for _ in range(120):
            if os.path.exists(SOCKET_PATH):
                break
            time.sleep(1)
        if not os.path.exists(SOCKET_PATH):
            raise SystemExit("HAProxy runtime socket did not appear")
        # HAProxy starts with disabled runtime slots. Restore the persisted pool
        # (or the one-time initial backend) before reopening an abandoned prepare.
        active_backends = read_active_backends()
        if not active_backends and INITIAL_BACKENDS.strip():
            active_backends = validate_backends(INITIAL_BACKENDS)
            initial_identity = (
                probe_initial_shared_pool(active_backends)
                if len(active_backends) >= 2
                else {}
            )
            persist_active(
                active_backends,
                initial_identity.get("pubkey", read_text(ACTIVE_PUBKEY_PATH)),
                code_id=initial_identity.get(
                    "code_id", read_text(ACTIVE_CODE_ID_PATH)
                ),
                cluster=initial_identity.get(
                    "cluster", read_text(ACTIVE_CLUSTER_PATH)
                ),
                members=initial_identity.get(
                    "members",
                    [
                        member
                        for member in read_text(ACTIVE_MEMBERS_PATH).split(",")
                        if member
                    ],
                ),
            )
        abandoned = read_prepared()
        previous = abandoned.get("previous") if abandoned else None
        if (
            abandoned.get("commit_started") is True
            and isinstance(previous, dict)
        ):
            # The prepared journal is the commit boundary. If the controller died
            # after changing any runtime slot but before clearing it, restore the
            # complete old pool and evict sessions from every candidate slot.
            restore_state(previous, close_existing=True)
        else:
            set_pool(active_backends)
        # A controller restart must never leave frontends paused from an abandoned
        # prepare or interrupted commit.
        if abandoned:
            clear_prepared()
        frontends(True)
        ip = mesh_ip()
        print(f"indexer-lb-controller: listening on {ip}:50053", flush=True)
        ThreadingHTTPServer((ip, 50053), Handler).serve_forever()
        PY
        exec python3 /tmp/indexer_lb_controller.py

volumes:
  sidecar-state:
  agent-sock:
  haproxy-run:
  indexer-lb-state:
