name: dstack

x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # First-boot migration boundary. The previous VM is already stopped when
  # Compose starts, so this captures every durable legacy volume before any
  # unified Webhost writer can run. The v1.1.3 migration marker makes later
  # patch-release attempts and restarts read-only.
  migration-backup:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    pull_policy: always
    restart: "no"
    read_only: true
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["DAC_READ_SEARCH"]
    logging: *production-logging
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -f /snapshot/v1.1.3.complete ]; then
          rm -f /snapshot/rollback-restored.complete /snapshot/rollback-restored.complete.tmp
          cd /snapshot
          sha256sum -c state.tar.sha256
          exit 0
        fi
        rm -f /snapshot/state.tar.tmp /snapshot/state.tar.sha256.tmp /snapshot/v1.1.3.complete.tmp
        tar -C /source -cf /snapshot/state.tar.tmp \
          daemon_data briefs digests caddy_data_v2 caddy_config_v2 sidecar-state
        mv /snapshot/state.tar.tmp /snapshot/state.tar
        cd /snapshot
        sha256sum state.tar > state.tar.sha256.tmp
        mv state.tar.sha256.tmp state.tar.sha256
        sync
        printf 'webhost-v1.1.3\n' > v1.1.3.complete.tmp
        mv v1.1.3.complete.tmp v1.1.3.complete
        sync
    volumes:
      - daemon_data:/source/daemon_data:ro
      - briefs:/source/briefs:ro
      - digests:/source/digests:ro
      - caddy_data_v2:/source/caddy_data_v2:ro
      - caddy_config_v2:/source/caddy_config_v2:ro
      - sidecar-state:/source/sidecar-state:ro
      - migration_backup:/snapshot

  sidecar:
    image: ghcr.io/attestmesh/cluster-mesh-agent@sha256:b9e0ae107d9db015c22059c9fecdc28f2b35e09b257eabb4739bd4e46d96f641
    restart: unless-stopped
    environment:
      - CHAIN_ID=${CHAIN_ID}
      - RPC_URL=${RPC_URL}
      - BUNDLER_URL=${BUNDLER_URL}
      - GAS_POLICY_ID=${GAS_POLICY_ID}
      - INDEXER_REGISTRY_ADDR=${INDEXER_REGISTRY_ADDR}
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
      - DSTACK_SOCKET=/var/run/dstack.sock
      - SIDECAR_STATE_DIR=/var/lib/attestmesh
      - HEALTH_HTTP_ADDR=0.0.0.0:9090
      - LOG_FORMAT=pretty
      - LOG_LEVEL=info,cluster_mesh_agent=debug
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - sidecar-state:/var/lib/attestmesh
    ports:
      - "9090:9090"
      - "51900:51900"
    cap_add: ["NET_ADMIN"]
    devices: [/dev/net/tun]
    depends_on:
      migration-backup:
        condition: service_completed_successfully

  storage-helper:
    image: ghcr.io/dmvt/webhost-control-storage-helper@sha256:c24fd69bc6dfae25c24a5f95f703321957db92bac23ef80bc8fb67e7ddae66ac
    pull_policy: always
    restart: unless-stopped
    init: true
    privileged: true
    read_only: true
    network_mode: none
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging: *production-logging
    environment:
      STORAGE_ROOT: /storage
      STORAGE_HOST_ROOT: ${DAEMON_STORAGE_HOST_DIR:-/var/lib/docker/volumes/dstack_daemon_data/_data/storage}
      STORAGE_HELPER_SOCKET: /run/webhost-storage/helper.sock
      STORAGE_OWNER: ${DAEMON_SANDBOX_USER:-65532:65532}
      STORAGE_MOUNT_OPTIONS: loop,nodev,nosuid,noexec
      STORAGE_MAX_BYTES: ${DAEMON_RESOURCE_MAX_STORAGE_BYTES:-107374182400}
      STORAGE_MIN_FREE_BYTES: ${STORAGE_MIN_FREE_BYTES:-1073741824}
      STORAGE_TOTAL_MAX_BYTES: ${STORAGE_TOTAL_MAX_BYTES:-1099511627776}
      STORAGE_MAX_WORKERS: ${STORAGE_MAX_WORKERS:-16}
      STORAGE_REQUEST_TIMEOUT_SECONDS: ${STORAGE_REQUEST_TIMEOUT_SECONDS:-10}
      STORAGE_COMMAND_TIMEOUT_SECONDS: ${STORAGE_COMMAND_TIMEOUT_SECONDS:-300}
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${DAEMON_STORAGE_HOST_DIR:-/var/lib/docker/volumes/dstack_daemon_data/_data/storage}
        target: /storage
        bind:
          propagation: rshared
          create_host_path: false
      - storage_helper_run:/run/webhost-storage
    healthcheck:
      test: ["CMD", "python", "-m", "storage_helper.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s
    depends_on:
      migration-backup:
        condition: service_completed_successfully

  # Webhost v1.1.17 unifies the control API, admin UI, public directory, tenant
  # ingress, and runtime orchestration. These settings mirror its released
  # production Compose contract while retaining the live dstack volume names.
  frontproxy:
    image: ghcr.io/dmvt/webhost-control-control-plane@sha256:be4fbc00dd4075e96395a2354c14e20174d38bc007cd6dccdac30bc80602f5d5
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 1.0
    pids_limit: 1024
    logging: *production-logging
    environment:
      WEBHOST_ENV: production
      WEBHOST_VERSION: v1.1.17
      WEBHOST_BUILD_COMMIT: cfb2401afe762210d3738cc472fda84b0a098ad7
      WEBHOST_LOG_FORMAT: json
      WEBHOST_ADMIN_HOST: ${WEBHOST_ADMIN_HOST:-daemon.synclave.net}
      TEE_DAEMON_TOKEN: ${TEE_DAEMON_TOKEN:?set a 32-byte-or-longer control token}
      WEBHOST_MCP_TOKEN: ${WEBHOST_MCP_TOKEN:-}
      DSTACK_SOCKET: /var/run/dstack.sock
      DOCKER_SOCKET: /var/run/docker.sock
      PROXY_SOCKET_DIR: /var/run/proxy
      INGRESS_PORT: "8088"
      DAEMON_CONTAINER_RUNTIME: runsc
      DAEMON_SANDBOX_USER: ${DAEMON_SANDBOX_USER:-65532:65532}
      DAEMON_ENFORCE_EGRESS: "1"
      DAEMON_STORAGE_HELPER_SOCKET: /run/webhost-storage/helper.sock
      DAEMON_STORAGE_HOST_DIR: ${DAEMON_STORAGE_HOST_DIR:-/var/lib/docker/volumes/dstack_daemon_data/_data/storage}
      DAEMON_VOLUME_NAME: dstack_daemon_data
      DAEMON_VOLUME_MOUNT: /var/lib/tee-daemon
      DAEMON_DATA_DIR: /var/lib/tee-daemon/projects
      DAEMON_AUDIT_DIR: /var/lib/tee-daemon/audit
      DAEMON_TELEMETRY_DIR: /var/lib/tee-daemon/telemetry
      DAEMON_TUNNEL_DIR: /var/lib/tee-daemon/tunnels
      DAEMON_JOB_DIR: /var/lib/tee-daemon/jobs
      DAEMON_DEPLOY_CONCURRENCY: ${DAEMON_DEPLOY_CONCURRENCY:-3}
      DAEMON_MAX_PENDING_DEPLOYS: ${DAEMON_MAX_PENDING_DEPLOYS:-12}
      DAEMON_MAX_RETAINED_JOBS: ${DAEMON_MAX_RETAINED_JOBS:-1000}
      DAEMON_JOB_RETENTION_SECONDS: ${DAEMON_JOB_RETENTION_SECONDS:-86400}
      DAEMON_MAX_JOB_STATE_BYTES: ${DAEMON_MAX_JOB_STATE_BYTES:-16777216}
      DAEMON_JOB_EVENT_MAX_COUNT: ${DAEMON_JOB_EVENT_MAX_COUNT:-4000}
      DAEMON_JOB_EVENT_MAX_BYTES: ${DAEMON_JOB_EVENT_MAX_BYTES:-2097152}
      DAEMON_MAX_PROJECTS: ${DAEMON_MAX_PROJECTS:-1000}
      DAEMON_MAX_ACTIVE_PROJECTS: ${DAEMON_MAX_ACTIVE_PROJECTS:-100}
      DAEMON_MAX_ACTIVE_MEMORY_BYTES: ${DAEMON_MAX_ACTIVE_MEMORY_BYTES:-34359738368}
      DAEMON_MAX_ACTIVE_NANO_CPUS: ${DAEMON_MAX_ACTIVE_NANO_CPUS:-16000000000}
      DAEMON_TENANT_MAX_INFLIGHT: ${DAEMON_TENANT_MAX_INFLIGHT:-256}
      DAEMON_TENANT_MAX_INFLIGHT_PER_PROJECT: ${DAEMON_TENANT_MAX_INFLIGHT_PER_PROJECT:-32}
      DAEMON_TENANT_MAX_INFLIGHT_PER_CLIENT: ${DAEMON_TENANT_MAX_INFLIGHT_PER_CLIENT:-16}
      DAEMON_UPSTREAM_CONNECT_TIMEOUT_SECONDS: ${DAEMON_UPSTREAM_CONNECT_TIMEOUT_SECONDS:-5}
      DAEMON_UPSTREAM_HEADER_TIMEOUT_SECONDS: ${DAEMON_UPSTREAM_HEADER_TIMEOUT_SECONDS:-30}
      DAEMON_ATTESTATION_MAX_INFLIGHT: ${DAEMON_ATTESTATION_MAX_INFLIGHT:-4}
      DAEMON_DSTACK_TIMEOUT_SECONDS: ${DAEMON_DSTACK_TIMEOUT_SECONDS:-10}
      DSTACK_MAX_RESPONSE_BYTES: ${DSTACK_MAX_RESPONSE_BYTES:-8388608}
      DAEMON_AUDIT_MAX_BYTES: ${DAEMON_AUDIT_MAX_BYTES:-16777216}
      DAEMON_AUDIT_MAX_ENTRY_BYTES: ${DAEMON_AUDIT_MAX_ENTRY_BYTES:-262144}
      DAEMON_RTMR_TIMEOUT_SECONDS: ${DAEMON_RTMR_TIMEOUT_SECONDS:-15}
      DAEMON_RTMR_MAX_EVENTS: ${DAEMON_RTMR_MAX_EVENTS:-9000}
      DAEMON_RTMR_RESERVE_EVENTS: ${DAEMON_RTMR_RESERVE_EVENTS:-1000}
      DAEMON_RTMR_MAX_EVENT_LOG_BYTES: ${DAEMON_RTMR_MAX_EVENT_LOG_BYTES:-6291456}
      DAEMON_RTMR_RESERVE_BYTES: ${DAEMON_RTMR_RESERVE_BYTES:-2097152}
      DAEMON_TELEMETRY_MAX_BYTES: ${DAEMON_TELEMETRY_MAX_BYTES:-67108864}
      DAEMON_TELEMETRY_READ_BYTES: ${DAEMON_TELEMETRY_READ_BYTES:-16777216}
      DAEMON_TELEMETRY_TOTAL_MAX_BYTES: ${DAEMON_TELEMETRY_TOTAL_MAX_BYTES:-4294967296}
      DAEMON_TELEMETRY_QUEUE_SIZE: ${DAEMON_TELEMETRY_QUEUE_SIZE:-4096}
      DAEMON_TELEMETRY_FLEET_READ_BYTES: ${DAEMON_TELEMETRY_FLEET_READ_BYTES:-67108864}
      DAEMON_STORAGE_RESPONSE_TIMEOUT_SECONDS: ${DAEMON_STORAGE_RESPONSE_TIMEOUT_SECONDS:-330}
      DAEMON_DOCKER_DATA_ROOT: /host-docker-data
      DAEMON_DOCKER_MIN_FREE_BYTES: ${DAEMON_DOCKER_MIN_FREE_BYTES:-1073741824}
      EGRESS_PROXY_MEMORY_BYTES: ${EGRESS_PROXY_MEMORY_BYTES:-268435456}
      EGRESS_PROXY_NANO_CPUS: ${EGRESS_PROXY_NANO_CPUS:-500000000}
      EGRESS_PROXY_PIDS_LIMIT: ${EGRESS_PROXY_PIDS_LIMIT:-128}
      EGRESS_LOG_TAIL: ${EGRESS_LOG_TAIL:-5000}
      DAEMON_IMAGE_REGISTRY_ALLOWLIST: ${DAEMON_IMAGE_REGISTRY_ALLOWLIST:-docker.io,registry-1.docker.io,ghcr.io,quay.io}
      DAEMON_CONTAINER_LOG_MAX_SIZE: ${DAEMON_CONTAINER_LOG_MAX_SIZE:-10m}
      DAEMON_CONTAINER_LOG_MAX_FILES: ${DAEMON_CONTAINER_LOG_MAX_FILES:-3}
      APP_DOMAIN: ${APP_DOMAIN:-app.synclave.net}
      APP_DIRECTORY_HOST: ${DIRECTORY_HOST:-apps.synclave.net}
      PYTHONDONTWRITEBYTECODE: "1"
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/run/proxy:size=16m,mode=0700
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/dstack.sock
        target: /var/run/dstack.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/docker
        target: /host-docker-data
        read_only: true
        bind:
          create_host_path: false
      - daemon_data:/var/lib/tee-daemon
      - briefs:/var/lib/tee-daemon/briefs
      - digests:/var/lib/tee-daemon/digests
      - storage_helper_run:/run/webhost-storage:ro
      - type: bind
        source: ${DAEMON_STORAGE_HOST_DIR:-/var/lib/docker/volumes/dstack_daemon_data/_data/storage}
        target: ${DAEMON_STORAGE_HOST_DIR:-/var/lib/docker/volumes/dstack_daemon_data/_data/storage}
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
    networks: [edge]
    expose: ["8088"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          value=json.load(urllib.request.urlopen("http://127.0.0.1:8088/readyz",timeout=4));
          raise SystemExit(0 if value.get("ready") else 1)
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    stop_grace_period: 45s
    depends_on:
      migration-backup:
        condition: service_completed_successfully
      storage-helper:
        condition: service_healthy

  # Preserve the existing app-key-sealed periodic backup service and volume
  # inventory. It remains independent of the local migration rollback copy.
  backup:
    image: ghcr.io/dmvt/webhost-backup:backup-v1@sha256:e8121ac071000fc8ba27c7b8caae88bc763ef598b4cad13b5a15f06186c1ef54
    restart: unless-stopped
    environment:
      BACKUP_MODE: schedule
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_STORAGE: ${BACKUP_STORAGE:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-webhost}
      BACKUP_APP_ID: ${BACKUP_APP_ID:-}
    volumes:
      - daemon_data:/src/daemon_data:ro
      - briefs:/src/briefs:ro
      - digests:/src/digests:ro
      - caddy_data_v2:/src/caddy_data_v2:ro
      - caddy_config_v2:/src/caddy_config_v2:ro
      - sidecar-state:/src/sidecar-state:ro
      - /var/run/dstack.sock:/var/run/dstack.sock
    depends_on:
      migration-backup:
        condition: service_completed_successfully
      storage-helper:
        condition: service_healthy

  tlsproxy:
    image: ghcr.io/dmvt/webhost-control-tlsproxy@sha256:733e1ecc1ec436d3d3fc28482fff26e1141e167afd076dc72cb838457b8e9911
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging: *production-logging
    environment:
      WEBHOST_ADMIN_HOST: ${WEBHOST_ADMIN_HOST:-daemon.synclave.net}
      APP_DOMAIN: ${APP_DOMAIN:-app.synclave.net}
      APP_DIRECTORY_HOST: ${DIRECTORY_HOST:-apps.synclave.net}
      ACME_EMAIL: ${ACME_EMAIL:?set the ACME account email}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set Cloudflare token}
      CLOUDFLARE_SYNCLAVE_API_TOKEN: ${CLOUDFLARE_SYNCLAVE_API_TOKEN:?set Synclave Cloudflare token}
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - caddy_data_v2:/data
      - caddy_config_v2:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [edge]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --proto '=https' --tlsv1.2
          --max-time 8 --resolve "$${WEBHOST_ADMIN_HOST}:443:127.0.0.1"
          "https://$${WEBHOST_ADMIN_HOST}/_healthz" >/dev/null
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    stop_grace_period: 30s
    depends_on:
      frontproxy:
        condition: service_healthy

networks:
  edge:
    name: dstack_webhost_edge

volumes:
  sidecar-state:
    name: dstack_sidecar-state
  daemon_data:
    name: dstack_daemon_data
  storage_helper_run:
    name: dstack_storage_helper_run
  briefs:
    name: dstack_briefs
  digests:
    name: dstack_digests
  caddy_data_v2:
    name: dstack_caddy_data_v2
  caddy_config_v2:
    name: dstack_caddy_config_v2
  migration_backup:
    name: dstack_webhost_v1_1_3_migration_backup
