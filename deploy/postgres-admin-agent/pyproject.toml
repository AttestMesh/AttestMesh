[project]
name = "postgres-admin-agent"
version = "0.1.0"
description = "Matrix-connected administrative agent for a standalone PostgreSQL node."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "matrix-nio>=0.24",
    "openai>=1.30",
    "psycopg[binary]>=3.1",
]

[project.scripts]
postgres-admin-agent = "postgres_admin_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postgres_admin_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
