name: build-telegram-fts-mcp

# Builds the mesh-only Postgres full-text-search MCP server image (searches the
# telegram-sync archive) and publishes it to ghcr.io so the telegram-sync node CVM
# can pull it. See deploy/telegram-fts-mcp/.
on:
  push:
    paths:
      - "deploy/telegram-fts-mcp/**"
      - ".github/workflows/build-telegram-fts-mcp.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/telegram-fts-mcp
          file: ./deploy/telegram-fts-mcp/Dockerfile
          push: true
          tags: |
            ghcr.io/attestmesh/telegram-fts-mcp:latest
            ghcr.io/attestmesh/telegram-fts-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
