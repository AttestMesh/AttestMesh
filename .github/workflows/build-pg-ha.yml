name: build-pg-ha

# Builds the pg-ha image (Patroni + etcd + HAProxy layered on postgres-walg) for the
# Postgres HA cluster nodes and publishes it to ghcr.io so dstack CVMs can pull it.
# One image, three container roles selected by entrypoint. See deploy/pg-ha/ +
# docs/specs/pg-ha.md.
on:
  push:
    paths:
      - "deploy/pg-ha/**"
      - ".github/workflows/build-pg-ha.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/pg-ha
          file: ./deploy/pg-ha/Dockerfile
          push: true
          tags: |
            ghcr.io/attestmesh/pg-ha:latest
            ghcr.io/attestmesh/pg-ha:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
