name: build-hermes-workbench

# Builds the ssh node's workbench + Hermes Agent image (Nous Research
# hermes-agent pinned by commit, Paseo CLI, sshd workbench toolset) and
# publishes it to ghcr.io so the ssh-node CVM can pull it.
# See deploy/hermes-workbench/ + deploy/compose/ssh-node.yaml.
on:
  push:
    paths:
      - "deploy/hermes-workbench/**"
      - ".github/workflows/build-hermes-workbench.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/hermes-workbench
          file: ./deploy/hermes-workbench/Dockerfile
          push: true
          tags: |
            ghcr.io/attestmesh/hermes-workbench:latest
            ghcr.io/attestmesh/hermes-workbench:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
