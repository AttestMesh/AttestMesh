name: build-indexer

# Builds the AttestMesh indexer OCI image and publishes it to ghcr.io so dstack CVMs
# can pull it. Runs here because the deploy environment has no docker daemon.
# Context is the repo root: the indexer compiles the sidecar-owned canonical proto.
on:
  push:
    paths:
      - "indexer/**"
      - "sidecar/proto/**"
      - "deploy/indexer*.sh"
      - "deploy/compose/indexer-*.yaml"
      - "deploy/indexer-lb-runbook.md"
      - ".github/workflows/build-indexer.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.78
        with:
          components: clippy, rustfmt

      - name: Format
        working-directory: indexer
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: indexer
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: indexer
        run: cargo test --all-targets

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse deployment scripts
        run: bash -n deploy/indexer*.sh

      - name: Lint deployment scripts
        run: shellcheck deploy/indexer*.sh

  build:
    needs: [test, deploy-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./indexer/Dockerfile
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/attestmesh/attestmesh-indexer:latest' || '' }}
            ghcr.io/attestmesh/attestmesh-indexer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
