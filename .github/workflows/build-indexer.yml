name: build-indexer

# Builds the AttestMesh indexer OCI image and publishes it to ghcr.io so dstack CVMs
# can pull it. Runs here because the deploy environment has no docker daemon.
# Context is the repo root: the indexer compiles the sidecar-owned canonical proto.
on:
  push:
    paths:
      - "indexer/**"
      - "sidecar/proto/**"
      - ".github/workflows/build-indexer.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./indexer/Dockerfile
          push: true
          tags: |
            ghcr.io/attestmesh/attestmesh-indexer:latest
            ghcr.io/attestmesh/attestmesh-indexer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
