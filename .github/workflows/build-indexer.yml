name: build-indexer

# Builds the AttestMesh indexer OCI image and publishes it to ghcr.io so dstack CVMs
# can pull it. Runs here because the deploy environment has no docker daemon.
# Context is the repo root: the indexer compiles the sidecar-owned canonical proto.
on:
  push:
    paths:
      - "indexer/**"
      - "sidecar/**"
      - "contracts/**"
      - "deploy/indexer*.sh"
      - "deploy/generic-node.sh"
      - "deploy/generic-node-box.py"
      - "deploy/env.sh"
      - "deploy/lib.sh"
      - "deploy/onchain.sh"
      - "deploy/compose/indexer-*.yaml"
      - "deploy/tests/**"
      - "deploy/indexer-lb-runbook.md"
      - "docs/specs/indexer-ha.md"
      - ".github/workflows/build-indexer.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo.lock currently contains edition-2024 dependencies, which Cargo 1.78
      # cannot parse. Match the `rust:1-bookworm` release builder's stable channel.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        working-directory: indexer
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: indexer
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: indexer
        run: cargo test --all-targets

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Host-only deployment tests use real `cast` for calldata/create2 vectors.
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Parse deployment scripts
        run: bash -n deploy/indexer*.sh deploy/generic-node.sh deploy/onchain.sh

      - name: Lint deployment scripts
        # Warning+ keeps real deployment defects gating while avoiding
        # version-dependent informational findings in the existing scripts.
        run: shellcheck -S warning -x -e SC1090,SC1091,SC2018,SC2019 deploy/indexer*.sh deploy/generic-node.sh deploy/onchain.sh

      - name: Test deployment controllers and workers
        run: |
          python3 -m py_compile \
            deploy/generic-node-box.py \
            deploy/tests/test_indexer_ha_replica.py \
            deploy/tests/test_indexer_lb_controller.py \
            deploy/tests/test_indexer_lb_driver.py \
            deploy/tests/test_indexer_member_registration.py \
            deploy/tests/test_onchain_indexer_cluster.py
          python3 -m unittest \
            deploy.tests.test_indexer_ha_replica \
            deploy.tests.test_indexer_lb_controller \
            deploy.tests.test_indexer_lb_driver \
            deploy.tests.test_indexer_member_registration \
            deploy.tests.test_onchain_indexer_cluster

      - name: Render Indexer deployment compose files
        env:
          CHAIN_ID: "8453"
          RPC_URL: https://rpc.invalid
          BUNDLER_URL: https://bundler.invalid
          GAS_POLICY_ID: ci-test
          INDEXER_REGISTRY_ADDR: "0x1111111111111111111111111111111111111111"
          GATEWAY_DOMAIN: example.invalid
          CLUSTER: "0x2222222222222222222222222222222222222222"
          APP_ENV_B64: QQ==
        run: |
          docker compose -f deploy/compose/indexer-ha-replica-node.yaml config >/dev/null
          docker compose -f deploy/compose/indexer-lb-node.yaml config >/dev/null

  contracts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install pinned contract dependencies
        working-directory: contracts
        run: |
          install_dep() {
            repo="$1"
            name="$2"
            revision="$3"
            mkdir -p "lib/$name"
            git -C "lib/$name" init --quiet
            git -C "lib/$name" remote add origin "$repo"
            git -C "lib/$name" fetch --quiet --depth 1 origin "$revision"
            git -C "lib/$name" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "lib/$name" rev-parse HEAD)" = "$revision"
          }
          install_dep https://github.com/solidstate-network/solidstate-solidity.git solidstate-solidity 03fb235059c8426976c0a3cadcf176a10df23ebe
          install_dep https://github.com/OpenZeppelin/openzeppelin-contracts.git openzeppelin-contracts 69c8def5f222ff96f2b5beff05dfba996368aa79
          install_dep https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git openzeppelin-contracts-upgradeable fa525310e45f91eb20a6d3baa2644be8e0adba31
          install_dep https://github.com/eth-infinitism/account-abstraction.git account-abstraction 7af70c8993a6f42973f520ae0752386a5032abe7
          install_dep https://github.com/foundry-rs/forge-std.git forge-std 5cf980eefbf8a54050628334163127ed35453558

      - name: Check contract formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Test contracts
        working-directory: contracts
        run: forge test

  build:
    needs: [test, deploy-check, contracts-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./indexer/Dockerfile
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/attestmesh/attestmesh-indexer:latest' || '' }}
            ghcr.io/attestmesh/attestmesh-indexer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
