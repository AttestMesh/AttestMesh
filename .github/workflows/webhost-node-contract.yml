name: Webhost node contract

on:
  push:
    paths:
      - '.github/workflows/webhost-node-contract.yml'
      - 'deploy/compose/webhost-node*.yaml'
      - 'deploy/tests/test_webhost_node_contract.py'
      - 'deploy/webhost-node-box.py'
      - 'deploy/webhost-node-runbook.md'
      - 'deploy/webhost-node.sh'
  pull_request:
    paths:
      - '.github/workflows/webhost-node-contract.yml'
      - 'deploy/compose/webhost-node*.yaml'
      - 'deploy/tests/test_webhost_node_contract.py'
      - 'deploy/webhost-node-box.py'
      - 'deploy/webhost-node-runbook.md'
      - 'deploy/webhost-node.sh'

permissions:
  contents: read

concurrency:
  group: webhost-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Manifest, migration, and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check deployment entrypoints
        run: |
          bash -n deploy/webhost-node.sh
          # SC2015 is existing control-flow style in this deployment driver;
          # this contract gate is scoped to actionable migration findings.
          shellcheck -e SC1090,SC1091,SC2015 -- deploy/webhost-node.sh
          python3 -m py_compile deploy/webhost-node-box.py deploy/tests/test_webhost_node_contract.py

      - name: Run manifest and rollback contracts
        run: python3 deploy/tests/test_webhost_node_contract.py -v
