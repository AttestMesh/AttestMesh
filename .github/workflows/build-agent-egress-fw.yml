name: build-agent-egress-fw

# Builds the matrix-admin-agent egress firewall image (deny-all outbound except Synapse,
# Postgres, DNS, and the single pinned LLM host) and publishes it to ghcr.io so dstack CVMs
# can pull it. See docs/specs/matrix-admin-agent.md §12.
on:
  push:
    paths:
      - "deploy/agent-egress-fw/**"
      - ".github/workflows/build-agent-egress-fw.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/agent-egress-fw
          file: ./deploy/agent-egress-fw/Dockerfile
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/attestmesh/agent-egress-fw:latest' || '' }}
            ghcr.io/attestmesh/agent-egress-fw:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
