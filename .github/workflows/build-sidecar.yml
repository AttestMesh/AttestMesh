name: build-sidecar

# Builds the AttestMesh sidecar OCI image and publishes it to ghcr.io so dstack CVMs
# can pull it. Runs here because the deploy environment has no docker daemon.
on:
  push:
    paths:
      - "sidecar/**"
      - "deploy/compose/indexer-ha-replica-node.yaml"
      - "docs/specs/sidecar.md"
      - ".github/workflows/build-sidecar.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo.lock currently contains edition-2024 dependencies, which Cargo 1.78
      # cannot parse. Match the `rust:1-bookworm` release builder's stable channel.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        working-directory: sidecar
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: sidecar
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: sidecar
        run: cargo test --all-targets

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-container driver supports gha cache export (default driver does not).
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sidecar
          file: ./sidecar/Dockerfile
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/attestmesh/cluster-mesh-agent:latest' || '' }}
            ghcr.io/attestmesh/cluster-mesh-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
