name: build-postgres-admin-agent

# Builds the Postgres administrative Matrix bot image and publishes it to ghcr.io so dstack
# CVMs (standalone postgres-node and the pg-ha cluster) can pull it. Supports the deterministic
# !pg status/metrics/query/exec commands and, on pg-ha nodes, the Patroni-aware !pgha
# status/cluster/lag/switchover surface. See deploy/postgres-admin-agent/.
on:
  push:
    paths:
      - "deploy/postgres-admin-agent/**"
      - ".github/workflows/build-postgres-admin-agent.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/postgres-admin-agent
          file: ./deploy/postgres-admin-agent/Dockerfile
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/attestmesh/postgres-admin-agent:latest' || '' }}
            ghcr.io/attestmesh/postgres-admin-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
