name: build-telegram-admin-agent

# Builds the Telegram-sync admin Matrix bot image (Telethon session auth/reauth +
# sync-daemon control) and publishes it to ghcr.io so the telegram-sync node CVM can
# pull it. See deploy/telegram-admin-agent/.
on:
  push:
    paths:
      - "deploy/telegram-admin-agent/**"
      - ".github/workflows/build-telegram-admin-agent.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/telegram-admin-agent
          file: ./deploy/telegram-admin-agent/Dockerfile
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/attestmesh/telegram-admin-agent:latest' || '' }}
            ghcr.io/attestmesh/telegram-admin-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
