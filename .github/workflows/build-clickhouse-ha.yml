name: build-clickhouse-ha

# Builds the clickhouse-ha image (ClickHouse server + Keeper + HAProxy) for the ClickHouse HA
# cluster nodes and publishes it to ghcr.io so dstack CVMs can pull it. One image, three
# container roles selected by entrypoint. See deploy/clickhouse-ha/.
on:
  push:
    paths:
      - "deploy/clickhouse-ha/**"
      - ".github/workflows/build-clickhouse-ha.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/clickhouse-ha
          file: ./deploy/clickhouse-ha/Dockerfile
          push: true
          tags: |
            ghcr.io/attestmesh/clickhouse-ha:latest
            ghcr.io/attestmesh/clickhouse-ha:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print digest
        run: echo "ghcr.io/attestmesh/clickhouse-ha@${{ steps.push.outputs.digest }}"
