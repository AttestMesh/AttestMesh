name: build-pocket-mcp-failover

on:
  push:
    paths:
      - "deploy/overlays/pocket-mcp-read-retry.Dockerfile"
      - "deploy/overlays/pocket-mcp-read-retry.py"
      - ".github/workflows/build-pocket-mcp-failover.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable Pocket failover image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/overlays
          file: ./deploy/overlays/pocket-mcp-read-retry.Dockerfile
          push: true
          tags: ghcr.io/attestmesh/pocket-mcp-failover:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable digest
        run: |
          echo "digest=${{ steps.push.outputs.digest }}"
          echo "pin: ghcr.io/attestmesh/pocket-mcp-failover@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
