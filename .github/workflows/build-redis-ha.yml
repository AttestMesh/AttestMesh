name: build-redis-ha

# Builds the redis-ha image (Redis + Sentinel + HAProxy) for the Redis HA cluster nodes and
# publishes it to ghcr.io so dstack CVMs can pull it. One image, three container roles
# selected by entrypoint. See deploy/redis-ha/.
on:
  push:
    paths:
      - "deploy/redis-ha/**"
      - ".github/workflows/build-redis-ha.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/redis-ha
          file: ./deploy/redis-ha/Dockerfile
          push: true
          tags: |
            ghcr.io/attestmesh/redis-ha:latest
            ghcr.io/attestmesh/redis-ha:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print digest
        run: echo "ghcr.io/attestmesh/redis-ha@${{ steps.push.outputs.digest }}"
