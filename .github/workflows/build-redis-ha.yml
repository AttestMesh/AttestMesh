name: build-redis-ha

# Builds the redis-ha image (Redis + Sentinel + HAProxy) for the Redis HA cluster nodes and
# publishes it to ghcr.io so dstack CVMs can pull it. One image, three container roles
# selected by entrypoint. See deploy/redis-ha/.
on:
  push:
    paths:
      - "deploy/redis-ha/**"
      - ".github/workflows/build-redis-ha.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./deploy/redis-ha
          file: ./deploy/redis-ha/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/attestmesh/redis-ha:latest' || '' }}
            ghcr.io/attestmesh/redis-ha:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print digest
        run: echo "ghcr.io/attestmesh/redis-ha@${{ steps.push.outputs.digest }}"
