name: build-postgres-walg

# Builds the Matrix node's Postgres image with wal-g (encrypted base+WAL PITR backups to Cloudflare R2,
# keyed by the cluster shared key) + grpcurl, and publishes it to ghcr.io so dstack CVMs can pull it.
# A transparent passthrough to stock postgres:16 unless BACKUP_ENABLED=true. See deploy/postgres-walg/.
on:
  push:
    paths:
      - "deploy/postgres-walg/**"
      - ".github/workflows/build-postgres-walg.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./deploy/postgres-walg
          file: ./deploy/postgres-walg/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/attestmesh/postgres-walg:latest' || '' }}
            ghcr.io/attestmesh/postgres-walg:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
