name: build-fugu-router

# Builds the fugu-router image (LiteLLM proxy pooling Sakana Fugu subscription keys with
# PAYG fallback + orchestration-token telemetry callback) and publishes it to ghcr.io so
# the fugu-router node CVM can pull it. See deploy/fugu-router/.
on:
  push:
    paths:
      - "deploy/fugu-router/**"
      - ".github/workflows/build-fugu-router.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/fugu-router
          file: ./deploy/fugu-router/Dockerfile
          push: true
          tags: |
            ghcr.io/attestmesh/fugu-router:latest
            ghcr.io/attestmesh/fugu-router:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: |
          echo "digest=${{ steps.push.outputs.digest }}"
          echo "pin: ghcr.io/attestmesh/fugu-router@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
