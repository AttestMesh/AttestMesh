[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@solidstate/contracts/=lib/solidstate-solidity/contracts/",
    "@account-abstraction/contracts/=lib/account-abstraction/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read-write", path = "./script/deployments" },
    { access = "read", path = "./script/clusters" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
